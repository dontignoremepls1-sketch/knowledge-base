                    <button class="revision-calendar-button" type="button" data-revision-month="next" aria-label="Следующий месяц">→</button>
                  </div>
                </div>
                <div class="revision-scope-switch" role="group" aria-label="Масштаб истории редакций">
                  <button class="revision-scope-button" type="button" data-revision-scope="day" aria-pressed="true">День</button>
                  <button class="revision-scope-button" type="button" data-revision-scope="range" aria-pressed="false">Диапазон</button>
                  <button class="revision-scope-button" type="button" data-revision-scope="month" aria-pressed="false">Месяц</button>
                  <button class="revision-scope-button" type="button" data-revision-scope="year" aria-pressed="false">Год</button>
                </div>
                <div class="revision-calendar-selectors">
                  <label class="revision-calendar-field">
                    <span>Месяц</span>
                    <select id="revision-month-select" aria-label="Выбрать месяц">
                      ${revisionMonthNames.map((name, month) => `<option value="${month}">${e(name)}</option>`).join("")}
                    </select>
                  </label>
                  <label class="revision-calendar-field">
                    <span>Год</span>
                    <select id="revision-year-select" aria-label="Выбрать год">
                      ${revisionYears.map((year) => `<option value="${year}">${year}</option>`).join("")}
                    </select>
                  </label>
                </div>
                <div class="revision-range-status" id="revision-range-status" hidden>
                  <span id="revision-range-copy">Выберите начало диапазона</span>
                  <button class="revision-range-clear" type="button" data-revision-range-clear hidden>Сбросить</button>
                </div>
                <div class="revision-weekdays" aria-hidden="true">
                  <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                </div>
                <div class="revision-calendar-grid" id="revision-calendar-grid" role="grid" aria-labelledby="revision-calendar-title"></div>
                <p class="revision-calendar-legend">Подсвечены дни, в которые база менялась</p>
              </section>
              <section class="revision-day-panel" aria-live="polite" aria-label="Изменения за выбранную дату">
                <div class="revision-day-head">
                  <div>
                    <span class="revision-day-kicker" id="revision-day-kicker">Изменения за день</span>
                    <strong class="revision-day-title" id="revision-day-title"></strong>
                    <div class="revision-day-meta" id="revision-day-meta"></div>
                  </div>
                  <div class="revision-day-navigation" id="revision-day-navigation">
                    <button class="revision-date-nav" type="button" data-revision-date-nav="previous" aria-label="Предыдущая дата с изменениями">←</button>
                    <button class="revision-date-nav" type="button" data-revision-date-nav="next" aria-label="Следующая дата с изменениями">→</button>
                  </div>
                </div>
                <div class="revision-timeline" id="revision-timeline"></div>
              </section>
            </div>
          </details>`;

        const revisionCalendarTitle = revisionHost.querySelector("#revision-calendar-title");
        const revisionCalendarGrid = revisionHost.querySelector("#revision-calendar-grid");
        const revisionTimeline = revisionHost.querySelector("#revision-timeline");
        const revisionDayTitle = revisionHost.querySelector("#revision-day-title");
        const revisionDayMeta = revisionHost.querySelector("#revision-day-meta");
        const revisionDayKicker = revisionHost.querySelector("#revision-day-kicker");
        const revisionDayNavigation = revisionHost.querySelector("#revision-day-navigation");
        const revisionMonthSelect = revisionHost.querySelector("#revision-month-select");
        const revisionYearSelect = revisionHost.querySelector("#revision-year-select");
        const revisionRangeStatus = revisionHost.querySelector("#revision-range-status");
        const revisionRangeCopy = revisionHost.querySelector("#revision-range-copy");
        const revisionRangeClear = revisionHost.querySelector("[data-revision-range-clear]");

        const revisionDateFromKey = (key) => {
          const [year, month, day] = String(key || "").split("-").map(Number);
          return new Date(year, month - 1, day);
        };

        function revisionSelectionEntries() {
          let entries = [];
          if (revisionSelectionMode === "day") {
            entries = revisionsByDate.get(selectedRevisionDate) || [];
          } else if (revisionSelectionMode === "range") {
            if (!revisionRangeStart) return [];
            const start = revisionRangeStart;
            const end = revisionRangeEnd || revisionRangeStart;
            entries = revisionEntries.filter((entry) =>
              entry.parsed.key >= start && entry.parsed.key <= end,
            );
          } else if (revisionSelectionMode === "month") {
            entries = revisionEntries.filter((entry) =>
              entry.parsed.date.getFullYear() === revisionCalendarCursor.getFullYear() &&
              entry.parsed.date.getMonth() === revisionCalendarCursor.getMonth(),
            );
          } else {
            entries = revisionEntries.filter((entry) =>
              entry.parsed.date.getFullYear() === revisionCalendarCursor.getFullYear(),
            );
          }
          return [...entries].sort((left, right) => right.index - left.index);
        }

        function revisionDateIsInScope(key, date, hasRevisions) {
          if (!hasRevisions) return false;
          if (revisionSelectionMode === "month") {
            return date.getFullYear() === revisionCalendarCursor.getFullYear() &&
              date.getMonth() === revisionCalendarCursor.getMonth();
          }
          if (revisionSelectionMode === "year") {
            return date.getFullYear() === revisionCalendarCursor.getFullYear();
          }
          return false;
        }

        function renderRevisionModeControls() {
          revisionHost.querySelectorAll("[data-revision-scope]").forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.revisionScope === revisionSelectionMode));
          });
          revisionRangeStatus.hidden = revisionSelectionMode !== "range";
          revisionRangeClear.hidden = !revisionRangeStart;
          if (revisionSelectionMode !== "range") return;
          if (!revisionRangeStart) {
            revisionRangeCopy.textContent = "Выберите начало диапазона";
          } else if (!revisionRangeEnd) {
            revisionRangeCopy.textContent = `Начало: ${cleanRevisionDate(revisionDateFromKey(revisionRangeStart))} · выберите конец`;
          } else {
            revisionRangeCopy.textContent = `${cleanRevisionDate(revisionDateFromKey(revisionRangeStart))} — ${cleanRevisionDate(revisionDateFromKey(revisionRangeEnd))}`;
          }
        }

        function renderRevisionCalendar() {
          const year = revisionCalendarCursor.getFullYear();
          const month = revisionCalendarCursor.getMonth();
          const monthStart = new Date(year, month, 1);
          const firstDayOffset = (monthStart.getDay() + 6) % 7;
          const cells = Math.ceil((firstDayOffset + new Date(year, month + 1, 0).getDate()) / 7) * 7;
          revisionCalendarTitle.textContent = revisionMonthFormatter.format(monthStart);
          revisionMonthSelect.value = String(month);
          revisionYearSelect.value = String(year);
          revisionCalendarGrid.innerHTML = Array.from({ length: cells }, (_, index) => {
            const date = new Date(year, month, index - firstDayOffset + 1);
            const key = revisionDateKey(date);
            const dateEntries = revisionsByDate.get(key) || [];
            const hasRevisions = dateEntries.length > 0;
            const outside = date.getMonth() !== month;
            const isRangeEndpoint = revisionSelectionMode === "range" &&
              (key === revisionRangeStart || key === revisionRangeEnd);
            const isInRange = revisionSelectionMode === "range" &&
              revisionRangeStart && revisionRangeEnd &&
              key >= revisionRangeStart && key <= revisionRangeEnd;
            const isExactDay = revisionSelectionMode === "day" && key === selectedRevisionDate;
            const isInScope = revisionDateIsInScope(key, date, hasRevisions);
            const disabled = revisionSelectionMode !== "range" && !hasRevisions;
            const count = dateEntries.length;
            const detail = hasRevisions ? `, ${revisionCountLabel(count)}` : ", изменений нет";
            return `
              <button
                class="revision-calendar-day${outside ? " is-outside" : ""}${hasRevisions ? " has-revisions" : ""}${isInRange ? " is-in-range" : ""}${isInScope ? " is-in-scope" : ""}"
                type="button"
                role="gridcell"
                data-revision-calendar-date="${key}"
                ${hasRevisions ? `data-revision-date="${key}"` : ""}
                aria-label="${e(cleanRevisionDate(date))}${detail}"
                aria-pressed="${String(isRangeEndpoint || isExactDay)}"
                ${disabled ? "disabled" : ""}
              >
                <span>${date.getDate()}</span>
                ${count > 1 ? `<span class="revision-calendar-count">${count}</span>` : ""}
              </button>`;
          }).join("");
          const minMonth = earliestDate.getFullYear() * 12 + earliestDate.getMonth();
          const maxMonth = latestDate.getFullYear() * 12 + latestDate.getMonth();
          const cursorMonth = year * 12 + month;
          revisionHost.querySelector('[data-revision-month="previous"]').disabled = cursorMonth <= minMonth;
          revisionHost.querySelector('[data-revision-month="next"]').disabled = cursorMonth >= maxMonth;
          revisionHost.querySelector("[data-revision-latest]").disabled =
            revisionSelectionMode === "day" && selectedRevisionDate === latestDateKey && cursorMonth === maxMonth;
          [...revisionMonthSelect.options].forEach((option) => {
            const optionMonth = year * 12 + Number(option.value);
            option.disabled = optionMonth < minMonth || optionMonth > maxMonth;
          });
          renderRevisionModeControls();
        }

        function renderRevisionSelection(animate = false) {
          const dateEntries = revisionSelectionEntries();
          const uniqueDates = new Set(dateEntries.map((entry) => entry.parsed.key)).size;
          revisionDayNavigation.hidden = revisionSelectionMode !== "day";
          if (revisionSelectionMode === "day") {
            const selectedDate = revisionsByDate.get(selectedRevisionDate)?.[0]?.parsed.date;
            revisionDayKicker.textContent = "Изменения за день";
            revisionDayTitle.textContent = cleanRevisionDate(selectedDate);
            const selectedIndex = revisionDateKeys.indexOf(selectedRevisionDate);
            revisionDayMeta.textContent = `${revisionCountLabel(dateEntries.length)} · дата ${selectedIndex + 1} из ${revisionDateKeys.length}`;
            revisionHost.querySelector('[data-revision-date-nav="previous"]').disabled = selectedIndex <= 0;
            revisionHost.querySelector('[data-revision-date-nav="next"]').disabled = selectedIndex >= revisionDateKeys.length - 1;
          } else if (revisionSelectionMode === "range") {
            revisionDayKicker.textContent = "Изменения за диапазон";
            if (!revisionRangeStart) {
              revisionDayTitle.textContent = "Выберите две даты";
              revisionDayMeta.textContent = "Сначала начало, затем конец периода";
            } else if (!revisionRangeEnd) {
              revisionDayTitle.textContent = `От ${cleanRevisionDate(revisionDateFromKey(revisionRangeStart))}`;
              revisionDayMeta.textContent = "Теперь выберите конечную дату";
            } else {
              revisionDayTitle.textContent = `${cleanRevisionDate(revisionDateFromKey(revisionRangeStart))} — ${cleanRevisionDate(revisionDateFromKey(revisionRangeEnd))}`;
              revisionDayMeta.textContent = `${revisionCountLabel(dateEntries.length)} · ${uniqueDates} дат с изменениями`;
            }
          } else if (revisionSelectionMode === "month") {
            revisionDayKicker.textContent = "Изменения за месяц";
            revisionDayTitle.textContent = revisionMonthFormatter.format(revisionCalendarCursor);
            revisionDayMeta.textContent = `${revisionCountLabel(dateEntries.length)} · ${uniqueDates} дат с изменениями`;
          } else {
            revisionDayKicker.textContent = "Изменения за год";
            revisionDayTitle.textContent = `${revisionCalendarCursor.getFullYear()} год`;
            revisionDayMeta.textContent = `${revisionCountLabel(dateEntries.length)} · ${uniqueDates} дат с изменениями`;
          }
          revisionTimeline.innerHTML = dateEntries.length
            ? dateEntries.map(revisionCardHtml).join("")
            : `<div class="revision-empty">${revisionSelectionMode === "range" ? "Отметьте начало и конец периода в календаре" : "За выбранный период изменений нет"}</div>`;
          if (animate && !reducedMotionQuery.matches) {
            revisionTimeline.classList.remove("is-changing");
            void revisionTimeline.offsetWidth;
            revisionTimeline.classList.add("is-changing");
            setTimeout(() => revisionTimeline.classList.remove("is-changing"), 220);
          }
        }

        function selectRevisionDate(key, focusSelected = false) {
          const dateEntries = revisionsByDate.get(key);
          if (!dateEntries?.length) return;
          revisionSelectionMode = "day";
          selectedRevisionDate = key;
          const selectedDate = dateEntries[0].parsed.date;
          revisionCalendarCursor = new Date(
            selectedDate.getFullYear(),
            selectedDate.getMonth(),
            1,
          );
          renderRevisionCalendar();
          renderRevisionSelection(true);
          if (focusSelected) {
            revisionHost.querySelector(`[data-revision-date="${key}"]`)?.focus();
          }
        }

        function selectRevisionRangeDate(key, focusSelected = false) {
          if (!revisionRangeStart || revisionRangeEnd) {
            revisionRangeStart = key;
            revisionRangeEnd = null;
          } else if (key < revisionRangeStart) {
            revisionRangeEnd = revisionRangeStart;
            revisionRangeStart = key;
          } else {
            revisionRangeEnd = key;
          }
          renderRevisionCalendar();
          renderRevisionSelection(true);
          if (focusSelected) {
            revisionHost.querySelector(`[data-revision-calendar-date="${key}"]`)?.focus();
          }
        }

        function setRevisionSelectionMode(mode) {
          if (!["day", "range", "month", "year"].includes(mode)) return;
          revisionSelectionMode = mode;
          if (mode === "day") {
            const selectedDate = revisionsByDate.get(selectedRevisionDate)?.[0]?.parsed.date;
            revisionCalendarCursor = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
          }
          renderRevisionCalendar();
          renderRevisionSelection(true);
        }

        revisionHost.addEventListener("click", (event) => {
          const target = event.target.closest("button");
          if (!target) return;
          const scope = target.dataset.revisionScope;
          if (scope) {
            setRevisionSelectionMode(scope);
            return;
          }
          const calendarDateKey = target.dataset.revisionCalendarDate;
          if (calendarDateKey && revisionSelectionMode === "range") {
            selectRevisionRangeDate(calendarDateKey);
            return;
          }
          const dateKey = target.dataset.revisionDate;
          if (dateKey) {
            selectRevisionDate(dateKey);
            return;
          }
          const monthDirection = target.dataset.revisionMonth;
          if (monthDirection) {
            revisionCalendarCursor = new Date(
              revisionCalendarCursor.getFullYear(),
              revisionCalendarCursor.getMonth() + (monthDirection === "next" ? 1 : -1),
              1,
            );
            renderRevisionCalendar();
            if (["month", "year"].includes(revisionSelectionMode)) {
              renderRevisionSelection(true);
            }
            return;
          }
          if (target.hasAttribute("data-revision-latest")) {
            revisionRangeStart = null;
            revisionRangeEnd = null;
            selectRevisionDate(latestDateKey, true);
            return;
          }
          if (target.hasAttribute("data-revision-range-clear")) {
            revisionRangeStart = null;
            revisionRangeEnd = null;
            renderRevisionCalendar();
            renderRevisionSelection(true);
            return;
          }
          const dateDirection = target.dataset.revisionDateNav;
          if (dateDirection) {
            const selectedIndex = revisionDateKeys.indexOf(selectedRevisionDate);
            const nextIndex = selectedIndex + (dateDirection === "next" ? 1 : -1);
            if (revisionDateKeys[nextIndex]) selectRevisionDate(revisionDateKeys[nextIndex], true);
          }
        });

        revisionHost.addEventListener("change", (event) => {
          if (event.target === revisionMonthSelect) {
            revisionCalendarCursor = new Date(
              revisionCalendarCursor.getFullYear(),
              Number(revisionMonthSelect.value),
              1,
            );
          } else if (event.target === revisionYearSelect) {
            revisionCalendarCursor = new Date(
              Number(revisionYearSelect.value),
              revisionCalendarCursor.getMonth(),
              1,
            );
            const minMonth = earliestDate.getFullYear() * 12 + earliestDate.getMonth();
            const maxMonth = latestDate.getFullYear() * 12 + latestDate.getMonth();
            const cursorMonth = revisionCalendarCursor.getFullYear() * 12 + revisionCalendarCursor.getMonth();
            if (cursorMonth < minMonth) revisionCalendarCursor = new Date(earliestDate.getFullYear(), earliestDate.getMonth(), 1);
            if (cursorMonth > maxMonth) revisionCalendarCursor = new Date(latestDate.getFullYear(), latestDate.getMonth(), 1);
          } else {
            return;
          }
          renderRevisionCalendar();
          if (["month", "year"].includes(revisionSelectionMode)) {
            renderRevisionSelection(true);
          }
        });

        revisionHost.addEventListener("keydown", (event) => {
          if (!event.target.matches("[data-revision-calendar-date]")) return;
          const movement = {
            ArrowLeft: -1,
            ArrowUp: -1,
            ArrowRight: 1,
            ArrowDown: 1,
          }[event.key];
          if (!movement && !["Home", "End"].includes(event.key)) return;
          event.preventDefault();
          if (revisionSelectionMode === "range") {
            const currentDate = revisionDateFromKey(event.target.dataset.revisionCalendarDate);
            const dayMovement = event.key === "ArrowUp" ? -7 : event.key === "ArrowDown" ? 7 : movement;
            const nextDate = event.key === "Home"
              ? new Date(currentDate.getFullYear(), currentDate.getMonth(), 1)
              : event.key === "End"
                ? new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0)
                : new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + dayMovement);
            revisionCalendarCursor = new Date(nextDate.getFullYear(), nextDate.getMonth(), 1);
            renderRevisionCalendar();
            revisionHost.querySelector(`[data-revision-calendar-date="${revisionDateKey(nextDate)}"]`)?.focus();
            return;
          }
          const currentIndex = revisionDateKeys.indexOf(event.target.dataset.revisionDate);
          const nextIndex = event.key === "Home"
            ? 0
            : event.key === "End"
              ? revisionDateKeys.length - 1
              : Math.max(0, Math.min(revisionDateKeys.length - 1, currentIndex + movement));
          selectRevisionDate(revisionDateKeys[nextIndex], true);
        });

        renderRevisionCalendar();
        renderRevisionSelection();
      }

      const reducedMotionQuery = matchMedia("(prefers-reduced-motion: reduce)");
      let revealObserver = null;
      let routeMotionTimer = 0;

      function setRevisionVisibility(isHome) {
        if (!revisionHost || !revisions.length) return;
        revisionHost.hidden = !isHome;
        revisionHost.setAttribute("aria-hidden", String(!isHome));
        if (!isHome) revisionHost.querySelector("details")?.removeAttribute("open");
      }

      function animateRouteEntry() {
        clearTimeout(routeMotionTimer);
        app.classList.remove("is-route-entering");
        if (reducedMotionQuery.matches) return;
        void app.offsetWidth;
        app.classList.add("is-route-entering");
        routeMotionTimer = setTimeout(
          () => app.classList.remove("is-route-entering"),
          280,
        );
      }

      function initRevealMotion(scope = app) {
        revealObserver?.disconnect();
        revealObserver = null;
        const targets = [
          ...scope.querySelectorAll([
            ".section-heading",
            ".home-section-heading",
            ".home-hero-console",
            ".home-resume",
            ".home-library-card",
            ".home-area-card",
            ".home-route-card",
            ".home-update-card",
            ".home-map-gateway",
            ".book-guide",
            ".book-card",
            ".domain-card",
            ".mindmap-panel",
            ".control-panel",
            ".topic-card",
            ".topic-hero",
            ".speech-reader",
            ".article-reading-content > h2",
            ".article-reading-content > h3",
            ".article-reading-content > blockquote",
            ".article-reading-content > .table-scroll",
            ".aside-panel",
            ".related-card",
          ].join(",")),
        ];
        if (!targets.length || reducedMotionQuery.matches) return;

        revealObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            const target = entry.target;
            const delay = Number(target.dataset.motionDelay || 0);
            target.classList.add("is-visible");
            observer.unobserve(target);
            setTimeout(() => {
              target.classList.remove("motion-reveal", "is-visible");
              target.style.removeProperty("--motion-delay");
              delete target.dataset.motionDelay;
            }, 310 + delay);
          });
        }, { rootMargin: "0px 0px -5% 0px", threshold: .05 });

        targets.forEach((target) => {
          const siblings = [...target.parentElement.children];
          const order = Math.max(0, siblings.indexOf(target));
          const delay = Math.min(order % 6, 5) * 22;
          target.dataset.motionDelay = String(delay);
          target.style.setProperty("--motion-delay", `${delay}ms`);
          target.classList.add("motion-reveal");
          revealObserver.observe(target);
        });
      }

      data.topics.forEach(refreshTopicSearchIndex);

      const state = {
        query: "",
        category: "all",
        book: "all",
        visible: 24,
        saved: new Set(),
      };
      const mapState = {
        expandedGroups: new Set(),
        expandedCategories: new Set(),
        query: "",
        mode: "root",
        activeGroupId: null,
        activeCategoryId: null,
        selectedTopicSlug: null,
        inspector: { type: "root", id: "root" },
        scale: 1,
        x: 0,
        y: 0,
        layoutHeight: 900,
        layoutMinX: 0,
        layoutWidth: 1600,
        groups: [],
        categories: [],
        nodePoints: [],
        bubbleLayout: null,
        bubbleAnimationFrame: null,
      };
      let activeMindmapTransition = null;
      const READING_HISTORY_KEY = "knowledge-reading-history";
      let readingHistory = [];
      let resumeRequestedSlug = null;

      try {
        state.saved = new Set(JSON.parse(localStorage.getItem("petryakov-saved") || "[]"));
      } catch (_) {}

      try {
        const storedHistory = JSON.parse(localStorage.getItem(READING_HISTORY_KEY) || "[]");
        readingHistory = Array.isArray(storedHistory)
          ? storedHistory.filter((item) => topicBySlug.has(item.slug)).slice(0, 18)
          : [];
      } catch (_) {}

      function persistReadingHistory() {
        try { localStorage.setItem(READING_HISTORY_KEY, JSON.stringify(readingHistory.slice(0, 18))); } catch (_) {}
      }

      function readingRecord(slug) {
        return readingHistory.find((item) => item.slug === slug) || null;
      }

      function touchReadingHistory(topic, update = {}) {
        const previous = readingRecord(topic.slug) || {};
        const next = {
          slug: topic.slug,
          progress: Number(previous.progress) || 0,
          scrollY: Number(previous.scrollY) || 0,
          viewedAt: Date.now(),
          ...update,
        };
        readingHistory = [next, ...readingHistory.filter((item) => item.slug !== topic.slug)].slice(0, 18);
        persistReadingHistory();
        return next;
      }

      const PROFILE_FORMAT = "knowledge-profile";
      const PROFILE_VERSION = 1;
      const CLOUD_SESSION_KEY = "knowledge-cloud-session";
      let cloudSession = null;
      try { cloudSession = JSON.parse(localStorage.getItem(CLOUD_SESSION_KEY) || "null"); } catch (_) {}

      function profileStatus(message, kind = "") {
        const host = document.querySelector("[data-profile-status]");
        if (!host) return;
        host.textContent = message;
        host.classList.toggle("is-success", kind === "success");
        host.classList.toggle("is-error", kind === "error");
      }

      function portableProfileData() {
        const speechProgress = {};
        try {
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (!key?.startsWith("knowledge-speech-progress:")) continue;
            const slug = key.slice("knowledge-speech-progress:".length);
            if (!topicBySlug.has(slug)) continue;
            speechProgress[slug] = JSON.parse(localStorage.getItem(key) || "null");
          }
        } catch (_) {}
        let speechSettings = {};
        try { speechSettings = JSON.parse(localStorage.getItem("knowledge-speech-settings") || "{}"); } catch (_) {}
        return {
          saved: [...state.saved].filter((slug) => topicBySlug.has(slug)),
          readingHistory: readingHistory.filter((item) => topicBySlug.has(item.slug)).slice(0, 18),
          speechSettings,
          speechProgress,
        };
      }

      function normalizePortableProfile(value) {
        const source = value?.data && value?.format === PROFILE_FORMAT ? value.data : value;
        if (!source || typeof source !== "object") throw new Error("Файл не содержит профиль базы знаний.");
        const saved = Array.isArray(source.saved)
          ? [...new Set(source.saved.filter((slug) => topicBySlug.has(slug)))]
          : [];
        const history = Array.isArray(source.readingHistory)
          ? source.readingHistory
              .filter((item) => item && topicBySlug.has(item.slug))
              .map((item) => ({
                slug: item.slug,
                progress: Math.min(1, Math.max(0, Number(item.progress) || 0)),
                scrollY: Math.max(0, Number(item.scrollY) || 0),
                viewedAt: Math.max(0, Number(item.viewedAt) || 0),
              }))
              .slice(0, 18)
          : [];
        const speechSettings = source.speechSettings && typeof source.speechSettings === "object"
          ? source.speechSettings
          : {};
        const speechProgress = source.speechProgress && typeof source.speechProgress === "object"
          ? Object.fromEntries(Object.entries(source.speechProgress).filter(([slug]) => topicBySlug.has(slug)))
          : {};
        return { saved, readingHistory: history, speechSettings, speechProgress };
      }

      function mergePortableProfiles(leftValue, rightValue) {
        const left = normalizePortableProfile(leftValue || {});
        const right = normalizePortableProfile(rightValue || {});
        const history = new Map();
        [...left.readingHistory, ...right.readingHistory].forEach((item) => {
          const previous = history.get(item.slug);
          if (!previous || item.viewedAt >= previous.viewedAt) history.set(item.slug, item);
        });
        return {
          saved: [...new Set([...left.saved, ...right.saved])],
          readingHistory: [...history.values()].sort((a, b) => b.viewedAt - a.viewedAt).slice(0, 18),
          speechSettings: { ...left.speechSettings, ...right.speechSettings },
          speechProgress: { ...left.speechProgress, ...right.speechProgress },
        };
      }

      function applyPortableProfile(value, { merge = true } = {}) {
        const next = merge
          ? mergePortableProfiles(portableProfileData(), value)
          : normalizePortableProfile(value);
        state.saved = new Set(next.saved);
        readingHistory = next.readingHistory;
        try {
          localStorage.setItem("petryakov-saved", JSON.stringify(next.saved));
          localStorage.setItem(READING_HISTORY_KEY, JSON.stringify(next.readingHistory));
          localStorage.setItem("knowledge-speech-settings", JSON.stringify(next.speechSettings));
          Object.entries(next.speechProgress).forEach(([slug, progress]) =>
            localStorage.setItem(`knowledge-speech-progress:${slug}`, JSON.stringify(progress))
          );
        } catch (error) {
          throw new Error(`Не удалось сохранить профиль в браузере: ${error.message}`);
        }
        refreshHomeLibraryCard();
        return next;
      }

      function exportPortableProfile() {
        const payload = {
          format: PROFILE_FORMAT,
          version: PROFILE_VERSION,
          exportedAt: new Date().toISOString(),
          data: portableProfileData(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `База знаний — профиль — ${new Date().toISOString().slice(0, 10)}.json`;
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        profileStatus("Профиль скачан", "success");
      }

      function persistCloudSession(session) {
        cloudSession = session || null;
        try {
          if (cloudSession) localStorage.setItem(CLOUD_SESSION_KEY, JSON.stringify(cloudSession));
          else localStorage.removeItem(CLOUD_SESSION_KEY);
        } catch (_) {}

      async function cloudRequest(pathname, { method = "GET", body, token } = {}) {
        if (!publicSync) throw new Error("Облачная синхронизация не подключена.");
        const response = await fetch(`${publicSync.url}${pathname}`, {
          method,
          headers: {
            apikey: publicSync.anonKey,
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...(pathname.startsWith("/rest/") ? { Prefer: "resolution=merge-duplicates,return=representation" } : {}),
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const payload = response.status === 204 ? null : await response.json().catch(() => null);
        if (!response.ok) throw new Error(payload?.msg || payload?.message || payload?.error_description || `Ошибка сервиса: ${response.status}`);
        return payload;
      }

      async function activeCloudSession() {
        if (!cloudSession?.access_token) return null;
        const expiresAt = Number(cloudSession.expires_at) || 0;
        if (!expiresAt || Date.now() / 1000 < expiresAt - 60) return cloudSession;
        if (!cloudSession.refresh_token) return null;
        const refreshed = await cloudRequest("/auth/v1/token?grant_type=refresh_token", {
          method: "POST",
          body: { refresh_token: cloudSession.refresh_token },
        });
        persistCloudSession(refreshed);
        return refreshed;
      }

      async function syncCloudProfile() {
        const session = await activeCloudSession();
        if (!session?.user?.id) throw new Error("Сначала войдите в облачный профиль.");
        cloudStatus("Сверяю данные…");
        const rows = await cloudRequest(`/rest/v1/knowledge_profiles?user_id=eq.${encodeURIComponent(session.user.id)}&select=data,updated_at`, {
          token: session.access_token,
        });
        const merged = mergePortableProfiles(rows?.[0]?.data || {}, portableProfileData());
        applyPortableProfile(merged, { merge: false });
        await cloudRequest("/rest/v1/knowledge_profiles?on_conflict=user_id", {
          method: "POST",
          token: session.access_token,
          body: {
            user_id: session.user.id,
            data: merged,
            updated_at: new Date().toISOString(),
          },
        });
        cloudStatus(`Синхронизировано · ${merged.saved.length} сохранённых`, "success");
      }

      async function authenticateCloudProfile(form, mode) {
        const values = new FormData(form);
        const email = String(values.get("email") || "").trim();
        const password = String(values.get("password") || "");
        cloudStatus(mode === "signup" ? "Создаю профиль…" : "Выполняю вход…");
        const endpoint = mode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
        const session = await cloudRequest(endpoint, { method: "POST", body: { email, password } });
        if (!session?.access_token) {
          cloudStatus("Проверьте почту и подтвердите регистрацию", "success");
          return;
        }
        persistCloudSession(session);
        renderCloudProfile();
        await syncCloudProfile();
      }

      async function logoutCloudProfile() {
        const session = await activeCloudSession().catch(() => null);
        if (session?.access_token) {
          await cloudRequest("/auth/v1/logout", { method: "POST", token: session.access_token }).catch(() => {});
        }
        persistCloudSession(null);
        renderCloudProfile();
      }

      function readingVolume(minutes) {
        if (minutes <= 3) return { level: 1, label: "очень короткая" };
        if (minutes <= 6) return { level: 2, label: "короткая" };
        if (minutes <= 9) return { level: 3, label: "средняя" };

        return { level: 5, label: "большая" };
      }

      function sourceItemMeta(source) {
        if (source.sourceType !== "video") return "";
        if (source.compactMeta) return "";
        const date =
          typeof source.uploadDate === "string" &&
          /^\d{8}$/.test(source.uploadDate)
            ? `${source.uploadDate.slice(6, 8)}.${source.uploadDate.slice(4, 6)}.${source.uploadDate.slice(0, 4)}`
            : "";
        const minutes = Number.isFinite(source.duration)
          ? `${Math.max(1, Math.round(source.duration / 60))} мин`
          : "";
        const transcript =
          source.transcriptSource === "manual"
            ? "ручные субтитры"
            : source.transcriptSource === "automatic"
              ? "авторасшифровка"
              : "метаданные";
        const chapters = Number(source.chapterCount)
          ? `${source.chapterCount} глав`
          : "";
        return [date, minutes, transcript, chapters]
          .filter(Boolean)
          .join(" · ");
      }

      function russianCount(count, one, few, many) {
        const value = Math.abs(Number(count));
        const lastTwo = value % 100;
        const last = value % 10;
        if (lastTwo >= 11 && lastTwo <= 14) return many;
        if (last === 1) return one;
        if (last >= 2 && last <= 4) return few;
        return many;
      }

      for (const extension of data.meta.taxonomyExtensions?.categories ?? []) {
        const group = mindmapGroups.find(
          (item) => item.id === extension.mindmapGroup,

        if (group && !group.categoryIds.includes(extension.id)) {
          group.categoryIds.push(extension.id);
        }
        if (extension.mindmapTitle) {
          mindmapCategoryTitles[extension.id] = extension.mindmapTitle;
        }
        if (extension.description) {
          mindmapCategoryDescriptions[extension.id] = extension.description;
        }
      }

      function mindmapCategoryTitle(category) {
        return mindmapCategoryTitles[category.id] || category.title;
      }

      function independentArticleCount(count) {
        const lastTwo = count % 100;
        const last = count % 10;
        const noun =
          lastTwo >= 11 && lastTwo <= 14
            ? "самостоятельных статей"
            : last === 1
              ? "самостоятельная статья"
              : last >= 2 && last <= 4
                ? "самостоятельные статьи"
                : "самостоятельных статей";
        return `${count} ${noun}`;
      }

      function getMindmapGroups() {
        return mindmapGroups.map((definition, index) => {
          const categories = definition.categoryIds
            .map((categoryId) => categoryById.get(categoryId))
            .filter(Boolean)
            .map((category) => ({
              category,
              topics: data.topics.filter(
                (topic) => topic.primaryCategoryId === category.id,
              ),
            }));
          return {
            definition,
            index,
            categories,
            topicCount: categories.reduce(
              (sum, item) => sum + item.topics.length,
              0,
            ),
            readingMinutes: categories.reduce(
              (sum, item) => sum + item.topics.reduce(
                (topicSum, topic) => topicSum + topic.readingMinutes,
                0,
              ),
              0,
            ),
          };
        });
      }

      function knowledgeProfileHtml() {
        const groups = getMindmapGroups();
        const centerX = 310;
        const centerY = 216;
        const radius = 148;
        const labelRadius = 196;
        const total = groups.length;
        const largestCount = Math.max(...groups.map((group) => group.topicCount), 1);
        const scaleMax = Math.ceil(largestCount / 10) * 10;
        const branchCount = groups.reduce((sum, group) => sum + group.categories.length, 0);
        const point = (distance, index) => {
          const angle = -Math.PI / 2 + (Math.PI * 2 * index) / total;
          return {
            x: centerX + Math.cos(angle) * distance,
            y: centerY + Math.sin(angle) * distance,
            cosine: Math.cos(angle),
          };
        };
        const polygon = (distance) =>
          groups.map((_group, index) => {
            const coordinate = point(distance, index);
            return `${coordinate.x.toFixed(1)},${coordinate.y.toFixed(1)}`;
          }).join(" ");
        const shapePoints = groups.map((group, index) => {
          const coordinate = point(radius * (group.topicCount / scaleMax), index);
          return `${coordinate.x.toFixed(1)},${coordinate.y.toFixed(1)}`;
        }).join(" ");
        const axes = groups.map((_group, index) => {
          const coordinate = point(radius, index);
          return `<line class="radar-axis" x1="${centerX}" y1="${centerY}" x2="${coordinate.x.toFixed(1)}" y2="${coordinate.y.toFixed(1)}"/>`;
        }).join("");
        const dots = groups.map((group, index) => {
          const coordinate = point(radius * (group.topicCount / scaleMax), index);
          const color = mapColors[group.definition.color] || mapColors.cyan;
          return `<circle class="radar-dot" cx="${coordinate.x.toFixed(1)}" cy="${coordinate.y.toFixed(1)}" r="5.5" fill="${color}"/>`;
        }).join("");
        const labels = groups.map((group, index) => {
          const coordinate = point(labelRadius, index);
          const anchor =
            coordinate.cosine > .28 ? "start" :
            coordinate.cosine < -.28 ? "end" :
            "middle";
          const x = coordinate.x.toFixed(1);
          const y = (coordinate.y - 2).toFixed(1);
          return `
            <text class="radar-label" x="${x}" y="${y}" text-anchor="${anchor}">
              ${e(group.definition.profileLabel)}
              <tspan class="radar-label-count" x="${x}" dy="12">${group.topicCount} ТЕМ</tspan>
            </text>`;
        }).join("");
        const accessibleSummary = groups
          .map((group) => `${group.definition.title}: ${group.topicCount} тем`)
          .join("; ");

        return `
          <div class="hud profile">
            <div class="profile-head">
              <span>KNOWLEDGE PROFILE · LIVE DATA</span>
              <span class="live">${data.meta.canonicalTopicCount} ТЕМ · ${total} КОНТУРОВ</span>
            </div>
            <svg class="radar" viewBox="0 0 620 450" role="img" aria-label="${e(accessibleSummary)}">
              <title>Распределение тем по смысловым контурам базы знаний</title>
              <defs>
                <linearGradient id="radar-fill" x1="0" x2="1">
                  <stop stop-color="#58d7ff" stop-opacity=".3"/>
                  <stop offset="1" stop-color="#48e5a2" stop-opacity=".18"/>
                </linearGradient>
              </defs>
              ${[.25, .5, .75, 1].map((level) =>
                `<polygon class="radar-ring" points="${polygon(radius * level)}"/>`
              ).join("")}
              ${axes}
              <polygon class="radar-shape" points="${shapePoints}"/>
              ${dots}
              ${labels}
            </svg>
            <p class="profile-caption">
              Радиус показывает количество самостоятельных статей в каждом контуре.
              Внешняя граница шкалы — ${scaleMax} тем. Это распределение материалов, а не оценка важности.
            </p>
            <div class="profile-facts">
              <div><strong>${total}</strong><span>смысловых контуров</span></div>
              <div><strong>${branchCount}</strong><span>тематическая ветвь</span></div>
              <div><strong>${data.meta.canonicalTopicCount}</strong><span>самостоятельных статей</span></div>
            </div>
          </div>`;
      }

      function groupForCategory(categoryId) {
        return getMindmapGroups().find((group) =>
          group.definition.categoryIds.includes(categoryId),
        );
      }

      function wrapMapLabel(value, limit = 32, maxLines = 2) {
        const words = String(value).split(/\s+/).filter(Boolean);
        const lines = [];
        let current = "";
        for (const rawWord of words) {
          const word = rawWord.length > limit
            ? `${rawWord.slice(0, Math.max(1, limit - 1))}…`
            : rawWord;
          const candidate = current ? `${current} ${word}` : word;
          if (candidate.length <= limit || !current) {
            current = candidate;
          } else {
            lines.push(current);
            current = word;
          }
          if (lines.length === maxLines - 1) break;
        }
        if (current && lines.length < maxLines) {
          const usedWords = lines.join(" ").split(/\s+/).filter(Boolean).length;
          const remaining = words.slice(usedWords).join(" ");
          lines.push(
            remaining.length > limit
              ? `${remaining.slice(0, limit - 1).trim()}…`
              : remaining,
          );
        }
        return lines.slice(0, maxLines);
      }

      function mapTextLines(lines, x, y, className, lineHeight = 17) {
        return `<text class="${className}">${lines
          .map(
            (line, index) =>
              `<tspan x="${x}" y="${y + index * lineHeight}">${e(line)}</tspan>`,
          )
          .join("")}</text>`;
      }

      function mapPath(x1, y1, x2, y2) {
        const bend = Math.max(52, Math.abs(x2 - x1) * 0.44);
        const direction = x2 > x1 ? 1 : -1;
        return `M ${x1} ${y1} C ${x1 + bend * direction} ${y1}, ${x2 - bend * direction} ${y2}, ${x2} ${y2}`;
      }

      function mapRadialPath(
        x1,
        y1,
        x2,
        y2,
        rootCenterX,
        rootCenterY,
        targetSide = "left",
      ) {
        const radialX = x1 - rootCenterX;
        const radialY = y1 - rootCenterY;
        const radialLength = Math.max(1, Math.hypot(radialX, radialY));
        const distance = Math.hypot(x2 - x1, y2 - y1);
        const departure = Math.max(84, Math.min(190, distance * .34));
        const approach = Math.max(58, Math.min(142, distance * .24));
        const control1X = x1 + (radialX / radialLength) * departure;
        const control1Y = y1 + (radialY / radialLength) * departure;
        let control2X = x2;
        let control2Y = y2;

        if (targetSide === "top") {
          control2Y -= approach;
        } else if (targetSide === "bottom") {
          control2Y += approach;
        } else if (targetSide === "right") {
          control2X += approach;
        } else {
          control2X -= approach;
        }

        return `M ${x1} ${y1} C ${control1X} ${control1Y}, ${control2X} ${control2Y}, ${x2} ${y2}`;
      }

      function mapSoftBranchPath(x1, y1, x2, y2 = y1) {
        const bend = Math.max(7, Math.min(24, Math.abs(x2 - x1) * .42));
        return `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`;
      }

      function mapCardLanePath(x1, y1, x2, y2, cardTop) {
        const safeX = x1 + 30;
        const laneY = Math.max(24, cardTop - 9);
        const approachX = x2 - 16;
        const firstControlY = y1 + (laneY - y1) * .58;
        return [
          `M ${x1} ${y1}`,
          `C ${x1 + 16} ${y1}, ${safeX} ${firstControlY}, ${safeX} ${laneY}`,
          `C ${safeX + 52} ${laneY}, ${approachX - 52} ${laneY}, ${approachX} ${laneY}`,
          `C ${approachX} ${laneY + 10}, ${approachX} ${y2}, ${x2} ${y2}`,
        ].join(" ");
      }

      function mapNodeCard({
        className,
        dataAttribute = "",
        x,
        y,
        width,
        height,
        color,
        code,
        title,
        meta,
        index = "",
        selected = false,
        role = "button",
        label = title,
        labelLimit = 30,
      }) {
        const titleLines = wrapMapLabel(title, labelLimit, 2);
        const compact = height <= 68;
        const titleY = compact ? 40 : 47;
        const titleLineHeight = compact ? 15 : 17;
        return `
          <g class="mindmap-node ${className}${selected ? " is-selected" : ""}"
            ${dataAttribute} tabindex="0" role="${role}" aria-label="${e(label)}"
            transform="translate(${x} ${y})" style="--node-color:${color}">
            <g class="mindmap-node-motion">
              <title>${e(title)}${meta ? ` · ${e(meta)}` : ""}</title>
              <rect width="${width}" height="${height}" rx="13"/>
              <rect class="node-accent" width="4" height="${height - 20}" x="0" y="10" rx="2"/>
              ${index ? `<text class="node-index" x="${width - 13}" y="${height - 12}" text-anchor="end">${e(index)}</text>` : ""}
              <text class="node-code" x="16" y="21">${e(code)}</text>
              ${mapTextLines(titleLines, 16, titleY, "node-title", titleLineHeight)}
              ${meta ? `<text class="node-meta" x="${width - 15}" y="21" text-anchor="end">${e(meta)}</text>` : ""}
            </g>
          </g>`;
      }

      function fitMindmapNodeTitles(layer) {
        layer
          .querySelectorAll(".mindmap-node:not(.mindmap-root)")
          .forEach((node) => {
            const title = node.querySelector(".node-title");
            const bubble = node.querySelector(".node-surface");
            const card = node.querySelector(
              ".mindmap-node-motion > rect:not(.node-accent)",
            );
            if (!title || (!card && !bubble)) return;

            const lines = [...title.querySelectorAll("tspan")];
            if (!lines.length) return;

            if (bubble) {
              const stableSize = Number.parseFloat(getComputedStyle(title).fontSize) || 14;
              title.dataset.fittedSize = stableSize.toFixed(2);
              return;
            }

            const width = Number(card.getAttribute("width")) || 0;
            const height = Number(card.getAttribute("height")) || 0;
            const currentSize =
              Number.parseFloat(getComputedStyle(title).fontSize) || 14.5;
            const isFocus = node.classList.contains("mindmap-focus");
            const isGroup = node.classList.contains("mindmap-group");
            const isCategory = node.classList.contains("mindmap-category");
            const isTopic = node.classList.contains("mindmap-topic");
            const oneLine = lines.length === 1;

            let maximumSize = oneLine ? 18 : 15.5;
            if (isFocus) maximumSize = oneLine ? 22 : 19.5;
            else if (isGroup) maximumSize = oneLine ? 20.5 : 18;
            else if (isCategory) maximumSize = oneLine ? 20 : 17.5;
            else if (isTopic) {
              maximumSize = oneLine
                ? width >= 340
                  ? 18
                  : 16.5
                : height <= 68
                  ? 14.5
                  : 16;
            }

            let widthLimit = maximumSize;
            const index = node.querySelector(".node-index");
            lines.forEach((line, lineIndex) => {
              const measuredWidth = line.getComputedTextLength();
              if (!measuredWidth) return;
              const baselineY = Number(line.getAttribute("y")) || 0;
              const indexSharesLine =
                index &&
                lineIndex === lines.length - 1 &&
                baselineY > height * .45;
              const availableWidth =
                width - (indexSharesLine ? 82 : 34);
              widthLimit = Math.min(
                widthLimit,
                currentSize * (availableWidth / measuredWidth),
              );
            });

            const firstY = Number(lines[0].getAttribute("y")) || 0;
            const lastY =
              Number(lines.at(-1).getAttribute("y")) || firstY;
            const topLimit = Math.max(
              12.5,
              (firstY - 25) / .78,
            );
            const bottomLimit = Math.max(
              12.5,
              (height - 2 - lastY) / .22,
            );
            const fittedSize = Math.max(
              12.5,
              Math.min(maximumSize, widthLimit, topLimit, bottomLimit),
            );

            title.style.fontSize = `${fittedSize.toFixed(2)}px`;
            title.dataset.fittedSize = fittedSize.toFixed(2);
          });
      }

      function renderMindmapRoot(groups, edges, nodes, points) {
        if (window.innerWidth < 640) {
          const width = 760;
          const rowCount = Math.ceil(groups.length / 2);
          const height = Math.max(1080, 258 + rowCount * 202 + 90);
          const rootX = 240;
          const rootY = 54;
          const rootCenterX = rootX + 140;

      function bubbleTimeLabel(minutes) {
        const rounded = Math.max(1, Math.round(minutes));
        if (rounded < 60) return `${rounded} мин`;
        const hours = Math.floor(rounded / 60);
        const remainder = rounded % 60;
        return remainder ? `${hours} ч ${remainder} мин` : `${hours} ч`;
      }

      function bubbleRadius(value, minimum, maximum, minimumRadius, maximumRadius) {
        const low = Math.sqrt(Math.max(0, minimum));
        const high = Math.sqrt(Math.max(minimum, maximum));
        if (high - low < .001) return (minimumRadius + maximumRadius) / 2;
        const ratio = Math.max(0, Math.min(1, (Math.sqrt(Math.max(0, value)) - low) / (high - low)));
        return minimumRadius + (maximumRadius - minimumRadius) * ratio;
      }
