<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#03060b">
  <title>База знаний</title>
  <style>
    :root {
      --bg: #03060b;
      --panel: #0e1424;
      --panel-2: #121a2f;
      --line: rgba(129, 154, 201, .2);
      --line-bright: rgba(157, 185, 235, .36);
      --text: #f3f6ff;
      --soft: #aeb8d1;
      --dim: #68738f;
      --cyan: #58d7ff;
      --green: #48e5a2;
      --magenta: #ff5f9b;
      --violet: #a27cff;
      --orange: #ff9d62;
      --yellow: #ffd75e;
      --blue: #6ea6ff;
      --pink: #ff7fb3;
      --lime: #92ed69;
      --accent: var(--cyan);
      --accent-rgb: 88, 215, 255;
      --shell: 1420px;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --motion-fast: 150ms;
      --motion-page: 220ms;
      --motion-ease: cubic-bezier(.2, .78, .24, 1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 86px;
    }

    body {
      margin: 0;
      min-width: 300px;
      color: var(--text);
      background:
        linear-gradient(rgba(76, 114, 160, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(76, 114, 160, .045) 1px, transparent 1px),
        radial-gradient(circle at 12% 15%, rgba(88, 215, 255, .075), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(162, 124, 255, .065), transparent 28%),
        var(--bg);
      background-size: 72px 72px, 72px 72px, auto, auto, auto;
      font-family: var(--sans);
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: -12%;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 24%, rgba(88, 215, 255, .045), transparent 30%),
        radial-gradient(circle at 76% 62%, rgba(162, 124, 255, .035), transparent 32%);
      opacity: .78;
      transform: translate3d(0, 0, 0) scale(1.02);
      animation: ambient-drift 14s ease-in-out infinite alternate;
    }

    body > * { position: relative; z-index: 1; }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    .accent-cyan { --accent: var(--cyan); --accent-rgb: 88, 215, 255; }
    .accent-green { --accent: var(--green); --accent-rgb: 72, 229, 162; }
    .accent-magenta { --accent: var(--magenta); --accent-rgb: 255, 95, 155; }
    .accent-violet { --accent: var(--violet); --accent-rgb: 162, 124, 255; }
    .accent-orange { --accent: var(--orange); --accent-rgb: 255, 157, 98; }
    .accent-yellow { --accent: var(--yellow); --accent-rgb: 255, 215, 94; }
    .accent-blue { --accent: var(--blue); --accent-rgb: 110, 166, 255; }
    .accent-pink { --accent: var(--pink); --accent-rgb: 255, 127, 179; }
    .accent-lime { --accent: var(--lime); --accent-rgb: 146, 237, 105; }

    .shell {
      width: min(calc(100% - 48px), var(--shell));
      margin-inline: auto;
    }

    .site-header {
      position: sticky;
      z-index: 50;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 6, 11, .9);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--cyan);
      border: 1px solid rgba(88, 215, 255, .5);
      background: rgba(88, 215, 255, .09);
      font: 800 11px/1 var(--mono);
      clip-path: polygon(18% 0, 82% 0, 100% 18%, 100% 82%, 82% 100%, 18% 100%, 0 82%, 0 18%);
    }

    .brand-text {
      display: grid;
      gap: 3px;
    }

    .brand-text strong {
      font: 800 13px/1 var(--mono);
      letter-spacing: .18em;
    }

    .brand-text small {
      color: var(--dim);
      font: 700 9px/1 var(--mono);
      letter-spacing: .18em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-nav a {
      min-height: 44px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--soft);
      border: 1px solid transparent;
      border-radius: 7px;
      text-decoration: none;
      font: 750 12px/1 var(--mono);
      letter-spacing: .055em;
      text-transform: uppercase;
      transition:
        color var(--motion-fast) ease,
        border-color var(--motion-fast) ease,
        background-color var(--motion-fast) ease,
        transform 90ms ease;
    }

    .header-nav svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--cyan);
      opacity: .78;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity .18s ease, filter .18s ease;
    }

    .header-nav a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255,255,255,.025);
    }

    .header-nav a:hover svg {
      opacity: 1;
      filter: drop-shadow(0 0 5px rgba(88,215,255,.42));
    }

    .revision-drawer {
      margin-top: 16px;
      position: relative;
      z-index: 12;
    }

    .revision-drawer[hidden] { display: none; }
    .revision-drawer[aria-hidden="false"] {
      animation: route-enter 180ms var(--motion-ease) both;
    }

    .revision-details {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(105deg, rgba(88,215,255,.055), transparent 42%),
        rgba(7,13,24,.88);
      box-shadow: 0 16px 38px rgba(0,0,0,.16);
    }

    .revision-summary {
      min-height: 54px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      list-style: none;
      color: var(--text);
    }

    .revision-summary::-webkit-details-marker { display: none; }
    .revision-summary::before {
      content: "↳";
      color: var(--cyan);
      font: 850 16px/1 var(--mono);
      transform: rotate(-90deg);
      transition: transform var(--motion-page) var(--motion-ease);
    }
    .revision-details[open] .revision-summary::before { transform: rotate(0); }
    .revision-summary strong {
      font: 820 12.5px/1.2 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .revision-summary > span {
      min-width: 0;
      color: var(--dim);
      font: 700 10.5px/1.25 var(--mono);
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .revision-summary em {
      color: var(--green);
      font: 800 10px/1 var(--mono);
      font-style: normal;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .revision-summary-date,
    .revision-summary-title { color: inherit; }

    .revision-browser {
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(290px, .72fr) minmax(0, 1.28fr);
      gap: 16px;
      border-top: 1px solid rgba(36,52,78,.7);
    }

    .revision-calendar-shell,
    .revision-day-panel {
      min-width: 0;
      border: 1px solid rgba(53,75,109,.72);
      border-radius: 13px;
      background: rgba(8,15,28,.66);
    }

    .revision-calendar-shell {
      align-self: start;
      padding: 17px;
    }

    .revision-calendar-toolbar,
    .revision-day-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .revision-calendar-kicker,
    .revision-day-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--cyan);
      font: 800 9.5px/1 var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .revision-calendar-title,
    .revision-day-title {
      display: block;
      color: var(--text);
      font-size: 16px;
      line-height: 1.2;
    }

    .revision-calendar-title { text-transform: capitalize; }

    .revision-scope-switch {
      margin-top: 15px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      border: 1px solid rgba(53,75,109,.62);
      border-radius: 10px;
      background: rgba(6,12,22,.66);
    }

    .revision-scope-button {
      min-width: 0;
      min-height: 34px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--dim);
      font: 800 9.5px/1 var(--mono);
      letter-spacing: .07em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        color var(--motion-fast) ease,
        border-color var(--motion-fast) ease,
        background var(--motion-fast) ease;
    }

    .revision-scope-button:hover,
    .revision-scope-button:focus-visible {
      color: var(--text);
      border-color: rgba(88,215,255,.3);
    }

    .revision-scope-button[aria-pressed="true"] {
      color: var(--cyan);
      border-color: rgba(88,215,255,.46);
      background: rgba(88,215,255,.09);
      box-shadow: inset 0 -2px rgba(88,215,255,.46);
    }

    .revision-calendar-selectors {
      margin-top: 11px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(92px, .55fr);
      gap: 8px;
    }

    .revision-calendar-field {
      min-width: 0;
      display: grid;
      gap: 5px;
      color: var(--faint);
      font: 800 9px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .revision-calendar-field select {
      width: 100%;
      min-height: 38px;
      padding: 0 30px 0 10px;
      border: 1px solid rgba(53,75,109,.72);
      border-radius: 8px;
      background: rgba(12,22,39,.9);
      color: var(--soft);
      font: 750 10px/1 var(--mono);
      text-transform: capitalize;
      cursor: pointer;
    }

    .revision-range-status {
      margin-top: 10px;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px dashed rgba(88,215,255,.3);
      border-radius: 9px;
      background: rgba(88,215,255,.045);
      color: var(--muted);
      font: 700 10.5px/1.45 var(--mono);
    }

    .revision-range-status[hidden] { display: none; }

    .revision-range-clear {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid rgba(53,75,109,.72);
      border-radius: 7px;
      background: rgba(12,22,39,.82);
      color: var(--dim);
      font: 800 9px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .revision-range-clear[hidden] { display: none; }

    .revision-calendar-controls,
    .revision-day-navigation {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .revision-calendar-button,
    .revision-date-nav {
      min-width: 38px;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid rgba(53,75,109,.82);
      border-radius: 9px;
      background: rgba(12,22,39,.86);
      color: var(--soft);
      font: 800 9px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        color var(--motion-fast) ease,
        border-color var(--motion-fast) ease,
        background var(--motion-fast) ease,
        transform var(--motion-fast) var(--motion-ease);
    }

    .revision-calendar-button:hover:not(:disabled),
    .revision-calendar-button:focus-visible,
    .revision-date-nav:hover:not(:disabled),
    .revision-date-nav:focus-visible {
      color: var(--text);
      border-color: rgba(88,215,255,.58);
      background: rgba(88,215,255,.08);
      transform: translateY(-1px);
    }

    .revision-calendar-button:disabled,
    .revision-date-nav:disabled {
      opacity: .28;
      cursor: default;
    }

    .revision-calendar-button--latest {
      min-width: 0;
      white-space: nowrap;
    }

    .revision-calendar-button[data-revision-month],
    .revision-date-nav {
      padding: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .revision-weekdays,
    .revision-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .revision-weekdays {
      margin: 17px 0 7px;
      color: var(--faint);
      font: 800 9px/1 var(--mono);
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .revision-calendar-grid { align-items: stretch; }

    .revision-calendar-day {
      position: relative;
      min-width: 0;
      min-height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: rgba(174,184,209,.42);
      font: 750 11px/1 var(--mono);
    }

    .revision-calendar-day.is-outside { opacity: .32; }
    button.revision-calendar-day.is-outside { opacity: .62; }
    button.revision-calendar-day.is-outside[aria-pressed="true"] { opacity: 1; }

    button.revision-calendar-day {
      cursor: pointer;
      transition:
        color var(--motion-fast) ease,
        border-color var(--motion-fast) ease,
        background var(--motion-fast) ease,
        transform var(--motion-fast) var(--motion-ease),
        box-shadow var(--motion-fast) ease;
    }

    button.revision-calendar-day.has-revisions {
      color: var(--soft);
      border-color: rgba(53,75,109,.65);
      background:
        radial-gradient(circle at 50% 100%, rgba(88,215,255,.12), transparent 62%),
        rgba(13,23,41,.9);
    }

    button.revision-calendar-day.has-revisions::after {
      content: "";
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(88,215,255,.7);
    }

    button.revision-calendar-day:hover,
    button.revision-calendar-day:focus-visible {
      color: var(--text);
      border-color: rgba(88,215,255,.62);
      transform: translateY(-2px);
    }

    button.revision-calendar-day:disabled {
      color: rgba(174,184,209,.42);
      cursor: default;
    }

    button.revision-calendar-day:disabled:hover {
      border-color: transparent;
      transform: none;
    }

    button.revision-calendar-day.is-in-range:not([aria-pressed="true"]),
    button.revision-calendar-day.is-in-scope:not([aria-pressed="true"]) {
      color: var(--cyan);
      border-color: rgba(88,215,255,.34);
      background: rgba(88,215,255,.075);
      box-shadow: inset 0 -2px rgba(88,215,255,.18);
    }

    button.revision-calendar-day[aria-pressed="true"] {
      color: #06101d;
      border-color: var(--cyan);
      background: var(--cyan);
      box-shadow: 0 0 0 1px rgba(88,215,255,.2), 0 8px 20px rgba(36,169,215,.22);
    }

    button.revision-calendar-day[aria-pressed="true"]::after {
      background: #06101d;
      box-shadow: none;
    }

    .revision-empty {
      grid-column: 1 / -1;
      min-height: 150px;
      padding: 24px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(53,75,109,.66);
      border-radius: 10px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .revision-calendar-count {
      position: absolute;
      top: 4px;
      right: 5px;
      color: inherit;
      font-size: 9px;
      opacity: .76;
    }

    .revision-calendar-legend {
      margin: 13px 0 0;
      padding-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(36,52,78,.6);
      color: var(--dim);
      font: 700 10px/1.45 var(--mono);
    }

    .revision-calendar-legend::before {
      content: "";
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 9px rgba(88,215,255,.62);
    }

    .revision-day-panel {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .revision-day-head {
      min-height: 76px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(36,52,78,.7);
      background: linear-gradient(110deg, rgba(88,215,255,.065), transparent 48%);
    }

    .revision-day-meta {
      margin-top: 6px;
      color: var(--dim);
      font: 700 10px/1.35 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .revision-timeline {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .revision-card {
      min-width: 0;
      padding: 15px;
      border: 1px solid rgba(53,75,109,.72);
      border-radius: 11px;
      background: rgba(10,18,32,.72);
      transition:
        transform var(--motion-fast) var(--motion-ease),
        border-color var(--motion-fast) ease,
        box-shadow var(--motion-page) ease;
    }

    .revision-card.is-current {
      border-color: rgba(88,215,255,.48);
      background: linear-gradient(135deg, rgba(88,215,255,.09), rgba(10,18,32,.76));
    }

    .revision-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--cyan);
      font: 800 10px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .revision-card h3 { margin: 9px 0 6px; font-size: 15px; line-height: 1.25; }
    .revision-card p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
    .revision-card ul { margin: 10px 0 0; padding-left: 17px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .revision-details[open] .revision-timeline {
      animation: revision-open var(--motion-page) var(--motion-ease) both;
    }

    .revision-timeline.is-changing .revision-card {
      animation: revision-day-change 180ms var(--motion-ease) both;
    }

    .hero {
      padding: 70px 0 76px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(390px, .95fr);
      gap: 42px;
      align-items: center;
    }

    .eyebrow, .section-code {
      color: var(--cyan);
      font: 800 10px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 840px;
      margin: 24px 0 22px;
      font-size: clamp(4rem, 7.7vw, 8rem);
      line-height: .86;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    .hero h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(174, 184, 209, .48);
    }

    .hero-lead {
      max-width: 700px;
      margin: 0;
      color: var(--soft);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-stats {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-block: 1px solid var(--line);
    }

    .hero-stat {
      min-height: 82px;
      padding: 17px 16px;
      display: grid;
      align-content: center;
      gap: 6px;
      border-left: 1px solid var(--line);
    }

    .hero-stat:first-child { border-left: 0; padding-left: 0; }
    .hero-stat strong { font: 800 24px/1 var(--mono); }
    .hero-stat span {
      color: var(--dim);
      font: 700 9.5px/1.2 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hud {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: 18px;
      background:
        linear-gradient(145deg, rgba(88, 215, 255, .045), transparent 48%),
        rgba(14, 20, 36, .89);
      box-shadow: inset 0 0 38px rgba(0,0,0,.18);
    }

    .profile {
      min-height: 460px;
      padding: 26px;
      display: grid;
      align-content: center;
    }

    .profile-head {
      position: absolute;
      inset: 20px 22px auto;
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font: 800 9.5px/1 var(--mono);
      letter-spacing: .12em;
    }

    .live { color: var(--green); }
    .radar { width: min(100%, 600px); margin: 22px auto 0; display: block; }
    .radar-ring { fill: none; stroke: rgba(129,154,201,.2); }
    .radar-axis { stroke: rgba(129,154,201,.16); }
    .radar-shape {
      fill: url(#radar-fill);
      stroke: var(--cyan);
      stroke-width: 3;
      filter: drop-shadow(0 0 7px rgba(88,215,255,.16));
    }
    .radar-dot { stroke: #eafff6; stroke-width: 2; }
    .radar-label {
      fill: #8290b2;
      font: 750 9.5px/1 var(--mono);
      letter-spacing: .035em;
    }
    .radar-label-count {
      fill: var(--text);
      font-size: 10px;
      font-weight: 850;
    }

    .profile-caption {
      max-width: 60ch;
      margin: -2px auto 14px;
      color: var(--dim);

    .mindmap-summary {

    .mindmap-breadcrumbs.is-updating > *,
    .mindmap-summary.is-updating > * {
      animation: map-context-in .3s cubic-bezier(.22,1,.36,1) both;
    }

    .mindmap-breadcrumbs.is-updating > :nth-child(n+2),

    .mindmap-workspace {

      grid-template-columns: minmax(0, 1fr) 310px;
      min-height: 650px;

    .mindmap-viewport {
      position: relative;
      min-width: 0;
      height: min(76vh, 760px);
      min-height: 650px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(rgba(119,143,181,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(119,143,181,.026) 1px, transparent 1px),
        linear-gradient(rgba(88,215,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,215,255,.018) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 48%, rgba(74,96,132,.14), transparent 44%),
        radial-gradient(ellipse at 12% 82%, rgba(88,215,255,.032), transparent 30%),
        radial-gradient(ellipse at 88% 16%, rgba(162,124,255,.028), transparent 32%),
        #050913;
      background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px, auto, auto, auto, auto;
      user-select: none;
    }

    .mindmap-viewport::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background:
        repeating-radial-gradient(
          ellipse at 50% 49%,
          transparent 0 55px,
          rgba(151,168,198,.055) 56px,
          transparent 57px 104px
        ),
        radial-gradient(circle, rgba(174,190,219,.18) .65px, transparent .8px);
      background-size: auto, 27px 27px;
      mask-image: radial-gradient(ellipse at 50% 50%, #000 8%, rgba(0,0,0,.68) 48%, transparent 88%);
    }

    .mindmap-viewport::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5,9,19,.42), transparent 11%, transparent 89%, rgba(5,9,19,.42)),
        linear-gradient(180deg, rgba(5,9,19,.18), transparent 14%, transparent 86%, rgba(5,9,19,.25));
    }

    .mindmap-viewport.is-navigating::before {
      animation: map-background-focus .58s cubic-bezier(.22,1,.36,1) both;
    }

    .mindmap-viewport.is-dragging { cursor: grabbing; }

    .mindmap-canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    .mindmap-viewport.is-navigating .mindmap-canvas {
      animation: map-canvas-refresh .46s cubic-bezier(.22,1,.36,1) both;
    }

    .mindmap-layer {
      transform-origin: 0 0;
      will-change: transform;
    }

    .mindmap-edge {
      fill: none;
      stroke-width: 1.7;
      stroke-opacity: .42;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 3px currentColor);
      animation: map-edge-draw .62s cubic-bezier(.22,1,.36,1) both;
      animation-delay: var(--map-delay, 0ms);

    .mindmap-edge:not(.mindmap-edge--context) {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .mindmap-edge--topic { stroke-width: 1.15; stroke-opacity: .28; }
    .mindmap-edge--context {
      stroke-dasharray: 4 6;
      stroke-opacity: .25;
      animation-name: map-edge-context-in;
    }
    .mindmap-edge--trunk {
      stroke-width: 1.35;
      stroke-opacity: .3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mindmap-edge--branch {
      stroke-width: 1.2;
      stroke-opacity: .42;
      stroke-linecap: round;
    }

    .mindmap-port {
      pointer-events: none;
      fill: var(--port-color);
      stroke: #07101c;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 5px var(--port-color));
    }

    .mindmap-node {
      cursor: pointer;
      outline: none;
    }

    .mindmap-node-motion {
      transform-box: fill-box;
      transform-origin: center;
      animation: map-node-settle .48s cubic-bezier(.22,1,.36,1) both;
      animation-delay: var(--map-delay, 80ms);
    }

    .mindmap-node rect {
      fill: rgba(11,18,32,.97);
      stroke: var(--node-color);
      stroke-opacity: .57;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
      transition: 170ms ease;
    }

    .mindmap-node .node-accent { fill: var(--node-color); stroke: none; opacity: .9; }
    .mindmap-node .node-orbit { fill: none; stroke: var(--node-color); stroke-opacity: .22; stroke-dasharray: 3 7; }

    .mindmap-node:hover rect,
    .mindmap-node:focus rect,
    .mindmap-node.is-selected rect {
      fill: color-mix(in srgb, var(--node-color) 10%, rgba(14,22,39,.99));
      stroke-opacity: 1;
      filter: drop-shadow(0 0 11px color-mix(in srgb, var(--node-color) 58%, transparent));
    }

    .mindmap-node.is-selected rect { stroke-width: 2; }

    .mindmap-node text {
      pointer-events: none;
      fill: var(--text);
      font-family: var(--sans);
    }

    .mindmap-node .node-code {
      fill: var(--node-color);
      font: 850 10px/1 var(--mono);
      letter-spacing: .1em;
    }

    .mindmap-node .node-title {
      font-size: 14.5px;
      font-weight: 780;
      letter-spacing: -.018em;
    }
    .mindmap-node .node-meta { fill: var(--dim); font: 750 9px/1 var(--mono); letter-spacing: .04em; }
    .mindmap-node .node-index { fill: var(--node-color); opacity: .22; font: 900 34px/1 var(--mono); }

    .mindmap-root rect {
      fill: rgba(88,215,255,.105);
      stroke: var(--cyan);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 20px rgba(88,215,255,.23));
    }

    .mindmap-root .node-title {
      fill: #fff;
      font: 870 21px/1 var(--sans);
      letter-spacing: -.025em;
    }

    .mindmap-focus rect,
    .mindmap-group rect {
      fill: color-mix(in srgb, var(--node-color) 12%, rgba(11,18,32,.98));
      stroke-width: 1.6;
    }

    .mindmap-focus .node-title,
    .mindmap-group .node-title { fill: #fff; font-size: 16.5px; font-weight: 830; }
    .mindmap-topic.is-match rect { fill: rgba(88,215,255,.12); stroke-opacity: 1; }
    .mindmap-topic.is-match .node-title { fill: #fff; }

    .mindmap-bubble {
      --bubble-title-size: 15px;
      --bubble-drift-x: 1px;
      --bubble-drift-y: -1px;
      transform-box: view-box;
      transform-origin: center;
      transition: opacity 150ms ease;

    .mindmap-bubble .mindmap-node-repel {
      transition: transform 260ms cubic-bezier(.22,1,.36,1);
    }

    .mindmap-bubble .mindmap-node-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: map-bubble-float var(--bubble-float-duration, 5.4s) ease-in-out var(--bubble-float-delay, 0s) infinite alternate;
    }

    .mindmap-bubble .node-surface {
      vector-effect: non-scaling-stroke;
    }

    .mindmap-bubble .node-surface {
      fill:
        color-mix(in srgb, var(--node-color) 8%, rgba(10,17,31,.985));

    .mindmap-layer.has-bubble-focus .mindmap-edge:not(.is-bubble-focus) {
      stroke-opacity: .08;

    }

    .mindmap-inspector::before {

    .mindmap-inspector-stat strong { color: #fff; font: 850 18px/1 var(--mono); }
    .mindmap-inspector-stat span { color: var(--dim); font: 750 9px/1.3 var(--mono); text-transform: uppercase; }

    .mindmap-inspector-path {

    .mindmap-inspector.is-updating > :nth-child(3) { animation-delay: 42ms; }

    @keyframes map-node-settle {
      from {
        opacity: 0;
        filter: blur(3px);
        transform: translateY(8px) scale(.975);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    @keyframes map-edge-draw {
      from { opacity: 0; stroke-dashoffset: 1; }

      to { opacity: 1; stroke-dashoffset: 0; }

    @keyframes map-edge-context-in {
      from { opacity: 0; stroke-dashoffset: 18; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes map-background-focus {
      from { opacity: .2; transform: scale(1.025); }

      to { opacity: .32; transform: scale(1); }
    }

    @keyframes map-inspector-content-in {

      to { opacity: 1; transform: translateY(0); }

    @keyframes map-context-in {

    @media (prefers-reduced-motion: reduce) {

      opacity: 0;
      background: radial-gradient(circle at var(--section-x, 50%) 50%, rgba(var(--accent-rgb),.42), transparent 7%);
      content: "";
    }

    .reading-progress-fill {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      background: linear-gradient(90deg, rgba(var(--accent-rgb),.72), var(--accent));
      box-shadow: 0 0 12px rgba(var(--accent-rgb),.62);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 70ms linear;
    }

    .reading-progress-fill::after {
      position: absolute;
      inset: 0 0 0 auto;
      width: 72px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65));
      opacity: .7;
      content: "";
      filter: blur(1px);
    }

    .reading-progress-markers { position: absolute; z-index: 2; inset: 0; }

    .reading-progress-marker {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border: 1px solid rgba(var(--accent-rgb),.48);
      border-radius: 50%;
      background: #070c17;
      box-shadow: 0 0 0 2px rgba(7,12,23,.86);
      opacity: .72;
      transform: translate(-50%, -50%) scale(.76);
      transition: background 150ms ease, border-color 150ms ease, box-shadow 180ms ease, opacity 150ms ease, transform 180ms ease;
    }

    .reading-progress-marker.is-complete {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(7,12,23,.9), 0 0 10px rgba(var(--accent-rgb),.72);
      opacity: 1;
      transform: translate(-50%, -50%) scale(.9);

    .reading-progress-marker:last-child { margin-left: -4px; }

    .reading-progress-marker.is-celebrating { animation: reading-marker-complete 620ms var(--motion-ease) both; }
    .reading-progress.is-section-complete::after { animation: reading-section-wave 680ms ease-out both; }
    .reading-progress.is-article-complete { animation: reading-article-finish 760ms var(--motion-ease) both; }

    @keyframes reading-marker-complete {

      100% { transform: translate(-50%, -50%) scale(.9); }
    }

    @keyframes reading-section-wave {
      0% { opacity: 0; transform: scaleX(.7); }
      32% { opacity: 1; }
      100% { opacity: 0; transform: scaleX(1.08); }
    }

    @keyframes reading-article-finish {
      0%, 100% { box-shadow: inset 0 0 7px rgba(0,0,0,.38); }

es":["аннотация статьи об арбалете заново формулирует её предмет: накопление энергии, ход тетивы, болт, перезарядка, производство, снабжение и тактическая роль","серийная конструкция «Вопрос раскрывается как самостоятельная система» удалена из всех материалов Бересты","каждая новая аннотация опирается на индивидуальные вводную и итоговую формулировки конкретной статьи","автоматический аудит запрещает номера плана, служебные шаблоны, повреждённую кодировку, разметку и одинаковые аннотации","вертикальный интервал между ветвями карты больше не может стать отрицательным при большом количестве элементов","высота и центр карты рассчитываются из фактического числа карточек с постоянным безопасным промежутком","новая браузерная проверка обходит корень, все контуры и все ветви на компьютере и телефоне и обнаруживает любое пересечение карточек"]},{"id":"source-backed-fullness-and-literary-flow","date":"04.08.2026","title":"Полнота и литературная связность по источникам","files":["База знаний — визуальная редакция.html"],"description":"Короткие и раздробленные статьи повторно сопоставлены с закреплёнными за ними книгами, расшифровками и исследованиями: потерянные детали возвращены в основной текст, а служебная карточная структура заменена связным изложением без удаления прежних фактов.","changes":["четырнадцать самых коротких материалов расширены предметными деталями из 41 назначенного видео FreshLife28 и сопровождающих научных источников","в статьи возвращены различия, условия и практические границы, которые исчезли при первом сжатом пересказе расшифровок","служебные подзаголовки «Коротко» внутри разделов удалены, а содержательные микрозаголовки превращены в спокойные смысловые акценты","повторяющиеся заголовки второго уровня получили индивидуальные названия по фактическому содержанию следующего подраздела","для всех 309 статей автоматически доказано сохранение каждого исходного прозаического блока","добавлена обязательная проверка полноты, литературной связности, уникальности разделов и происхождения новых фрагментов"]},{"id":"revision-history-calendar-navigation","date":"04.08.2026","title":"Календарь истории редакций","files":["База знаний — визуальная редакция.html"],"description":"История редакций получила календарную навигацию: сначала выбирается подсвеченная дата, затем показываются только относящиеся к ней изменения.","changes":["даты с редакциями подсвечены в календаре, а дни с несколькими этапами получили счётчик","выбранный день открывает прежние подробные карточки изменений без ссылок на архивные файлы","добавлены переходы к предыдущей, следующей и последней дате с изменениями","календарь поддерживает навигацию по месяцам, клавиши со стрелками, Home и End","на телефоне календарь, кнопки и карточки перестраиваются в один читаемый столбец без горизонтальной прокрутки","смена даты сопровождается короткой спокойной анимацией и учитывает системную настройку сокращённого движения"]},{"id":"revision-history-period-filters","date":"04.08.2026","title":"Периоды в истории редакций","files":["База знаний — визуальная редакция.html"],"description":"Календарь истории теперь позволяет собирать изменения не только за один день, но и за произвольный диапазон, выбранный месяц или целый год.","changes":["добавлены четыре масштаба просмотра: день, диапазон, месяц и год","диапазон задаётся двумя последовательными отметками в календаре и может пересекать границу месяца","месяц и год выбираются напрямую в компактных списках, а стрелки сохраняют последовательную навигацию","карточки справа автоматически объединяются по выбранному периоду и показывают число редакций и дат с изменениями","выбранные дни, границы диапазона и весь активный период получили разные визуальные состояния","фильтры периода, сброс и клавиатурная навигация адаптированы для мобильного экрана и сокращённого движения"]},{"id":"online-knowledge-base-positioning","date":"04.08.2026","title":"Единое онлайн-позиционирование","files":["База знаний — визуальная редакция.html"],"description":"Шапка, главный экран, история и подвал теперь последовательно представляют проект как актуальную онлайн-базу знаний.","changes":["в шапке закреплён единый статус ONLINE","главный экран обозначен как актуальная онлайн-библиотека во всех вариантах загрузки","подвал теперь показывает назначение базы и актуальные счётчики источников и тем","видимые карточки прошлых редакций приведены к тому же позиционированию","содержательные статьи и их предметная терминология сохранены без изменений"]},{"id":"alcohol-article-editorial-architecture","date":"04.08.2026","title":"Редакционная архитектура статьи о зависимости","files":["База знаний — визуальная редакция.html"],"description":"Статья об алкогольной зависимости получила спокойную многоуровневую композицию по образцу лучших материалов базы: крупные смысловые главы, предметные подразделы, визуальные ориентиры и отдельные практические последовательности без удаления исходных фактов.","changes":["двадцать пять накопленных разделов сведены в шесть крупных глав: от границы расстройства и механизма зависимости до лечения, повседневной трезвости и отношений с близкими","ключевые выводы получили смысловые акценты, а экстренные признаки, действия при тяге и возвращение после эпизода употребления — читаемые списки","устранена автоматическая цепочка однотипных заголовков, из-за которой материал воспринимался как набор последовательных тезисов","все прежние содержательные блоки, медицинские предостережения и сведения из закреплённых источников сохранены","изменение применено только к статье «Алкогольная зависимость и возвращение к трезвости»"]},{"id":"targeted-semantic-depth-expansion","date":"04.08.2026","title":"Адресное смысловое расширение статей","files":["База знаний — визуальная редакция.html","База знаний — отчёт о смысловом расширении.md"],"description":"Недораскрытые, чрезмерно сжатые и фрагментированные материалы получили новые предметные главы по уже закреплённым книгам, расшифровкам, исследованиям и исходным заметкам. Прежний текст каждой статьи сохранён дословно; редакция только добавляет определения, причинные связки, различия, примеры, границы вывода и практические сценарии.","changes":["расширены 50 статей из психологии, отношений, сексологии, здоровья, мышления, современной науки и схематерапии","широкие темы получили недостающие уровни механизма, диагностики границ, практического применения и различения близких понятий","статьи с большим числом видеоисточников получили литературный синтез вместо чрезмерного сжатия отдельных сюжетов","для фрагментированных материалов добавлены связующие главы, превращающие перечень тезисов в причинную модель без удаления прежних списков","для восьми ранних дезадаптивных схем добавлены цельные циклы потребности, копинга, немедленной функции, отложенной цены и здоровой взрослой альтернативы","отдельный Markdown-отчёт фиксирует для каждой статьи причину изменения, новые разделы, прирост объёма, использованный корпус источников и контроль сохранности исходного текста"]},{"id":"readability-map-focus-and-standalone-voice","date":"04.08.2026","title":"Читаемая типографика, фокус карты и самостоятельный голос","files":["База знаний — визуальная редакция.html"],"description":"Мелкая служебная типографика стала заметнее без увеличения карточек, переход из областей знаний теперь раскрывает и центрирует нужную ветвь карты, а следы дневникового пересказа источников заменены самостоятельным изложением с сохранением фактов.","changes":["увеличены подписи, метаданные, пояснения, элементы навигации и мелкий текст карточек на главной, в карте и внутри статей без раздувания самих блоков","сокращены избыточные вертикальные интервалы между главными разделами на десктопе и мобильных экранах","карточка области знаний открывает соответствующий контур карты, вписывает его в рабочую область и мягко центрирует саму карту в окне браузера","в 33 статьях исправлены 55 фрагментов, где самостоятельный материал неожиданно ссылался на неназванного автора, выпуск или личный опыт рассказчика","полевой фрагмент о Свердловске и обработке песчаника переписан как самостоятельное наблюдение: факты, числа, маршрут и ограничения доступа сохранены","в процесс выпуска добавлена обязательная проверка, не допускающая возвращения несамостоятельного авторского голоса в статьи"]},{"id":"freshlife28-webinar-corpus-integration","date":"05.08.2026","title":"Вебинарные практикумы FreshLife28","files":["База знаний — визуальная редакция.html"],"description":"Полные расшифровки пяти учебных циклов об осознанности, гневе, жизненных выводах, доверии к информации, самооценке и насильственных отношениях разобраны на самостоятельные смысловые фрагменты и встроены в предметные статьи без копирования разговорной стенограммы.","changes":["обработаны 24 вебинара общей продолжительностью почти 58 часов и объёмом 391 799 распознанных слов","все содержательные фрагменты распределены между существующими и новыми статьями; повторы, организационные реплики и дефекты распознавания отмечены отдельно","углублены материалы о гневе, фрустрации, психологических защитах, самооценке, абьюзе, когнитивных искажениях и проверке информации","добавлены самостоятельные статьи о практике осознанности и архитектуре доверия к информации","для локального корпуса создана проверяемая матрица сегментного покрытия, включённая в обязательную проверку выпуска","обновлены источники, связи, глоссарий, маршруты изучения, поиск, карта и расчёт времени чтения"]},{"id":"behavioral-learning-and-child-attachment-books","date":"06.08.2026","title":"Поведенческое обучение и детская привязанность","files":["База знаний — визуальная редакция.html"],"description":"Две книги полностью разобраны на самостоятельные смысловые темы: принципы обучения с подкреплением — на язык точной и этичной работы с поведением, а привязанностная модель взросления — на язык повседневных отношений ребёнка со значимыми взрослыми.","changes":["извлечены и редакционно разобраны 143 204 слова из двух локальных книг","добавлены самостоятельные статьи о подкреплении, шейпинге, сигналах, изменении привычек и этике влияния","добавлен связный цикл о детской привязанности, ориентации на ровесников, эмоциональном взрослении, обучении, дисциплине и восстановлении контакта","существующие материалы о привычках и семье дополнены без удаления прежних фактов и тезисов","для каждой главы зафиксировано содержательное назначение в проверяемой матрице полного покрытия","обновлены категории, источники, связи, глоссарий, маршруты, поиск, карта и история редакций"]},{"id":"required-books-literary-depth","date":"06.08.2026","title":"Полная глубина двух обязательных книг","files":["База знаний — визуальная редакция.html"],"description":"После повторной поглавной сверки статьи о поведенческом обучении и детской привязанности получили развёрнутый литературный слой: сохранены прежние формулировки, а недостающие аргументы, примеры, различия, практические развилки и ограничения встроены в самостоятельное изложение.","changes":["повторно проверено соотношение 143 204 слов исходного корпуса и фактической глубины шестнадцати целевых статей","пять материалов по Карен Прайор расширены подробной механикой подкрепления, шейпинга, стимульного контроля, изменения нежелательного поведения и применения в сложных системах","одиннадцать материалов по Гордону Ньюфелду и Габору Матэ дополнены культурным контекстом, внутренней логикой привязанности, развитием, школьными и семейными сценариями, дисциплиной и профилактикой","авторские истории преобразованы в самостоятельные примеры без дневникового голоса и без превращения статьи в конспект или стенограмму","поглавная матрица дополнена контролем редакционной глубины, чтобы тематическая ссылка на статью больше не считалась достаточным доказательством полноты","обновлены время чтения, оглавления, глоссарии, поиск, маршруты, источники и публичные пакеты статей"]},{"id":"gladwell-opportunity-and-achievement","date":"06.08.2026","title":"Возможность, обучение и составная природа успеха","files":["База знаний — визуальная редакция.html"],"description":"Выборочно интегрированы смысловые темы книги Малкольма Гладуэлла: накопительное преимущество, интеллект и социальная навигация, образовательный доступ, командная безопасность и связь социальной среды со здоровьем. Полный корпус изучен, но биографические и культурные отступления без самостоятельного механизма не переносились автоматически.","changes":["добавлены пять самостоятельных статей о накопительном преимуществе, интеллекте, образовательном неравенстве, безопасной коммуникации в иерархии и социальных связях как факторе здоровья","семь существующих материалов получили точечные литературные расширения о практике, экспертности, профессиональной возможности, атрибуции успеха, справедливом мире и самооценке","правило десяти тысяч часов отделено от универсального закона: объём практики рассмотрен вместе с качеством обратной связи, спецификой задачи и доступом к возможности","истории авиационных аварий дополнены официальным разбором человеческих факторов, усталости, стандартизированной коммуникации и ограничений национально-культурного объяснения","летний образовательный разрыв и пороговая модель интеллекта представлены как обсуждаемые интерпретации, а не окончательные причинные законы","добавлен маршрут о том, как способности, среда, практика, социальный капитал и исторический момент совместно формируют достижение","редакционный flow теперь различает полную и выборочную интеграцию и требует явных критериев отбора и причины для каждого непринятого фрагмента"]},{"id":"bubble-knowledge-map-and-collapsed-sources","date":"06.08.2026","title":"Живая карта объёма знаний","files":["База знаний — визуальная редакция.html"],"description":"Карта знаний перестроена как связанная система пузырей: размер каждого узла показывает объём чтения, столкновения разводят соседние темы, а короткая анимация помогает увидеть, как складывается текущий контур. Все группы источников внутри статей теперь открываются только по запросу читателя.","changes":["прямоугольные карточки карты заменены круглыми узлами с масштабом по времени чтения статьи или суммарному объёму ветви","для обзора, контуров и тематических ветвей используется единая force-композиция с мягким отталкиванием, предотвращением пересечений и плавными связями","наведение выделяет выбранный путь и слегка раздвигает соседние узлы, а переход между уровнями сопровождается быстрой сборкой новой конфигурации","добавлена постоянная легенда, объясняющая связь размера пузыря и объёма чтения; точное время остаётся внутри каждого узла и в инспекторе","движение автоматически отключается при системной настройке уменьшенной анимации, а клавиатурная навигация, масштабирование и мини-карта сохранены","книги, расшифровки, исследования, документы и связанные видео в разделе источников каждой статьи по умолчанию свёрнуты"]},{"id":"compact-orbit-bubble-map","date":"07.08.2026","title":"Компактные орбиты карты знаний","files":["База знаний — визуальная редакция.html"],"description":"Пузырьковая карта получила явную пространственную грамматику: родитель расположен слева, активная ветвь служит центром, а темы следуют по нумерованным орбитам. Размеры кругов теперь заметно различаются по времени чтения, а лишние декоративные контуры удалены.","changes":["технически случайное размещение заменено стабильным редакционным порядком: сначала внутренняя орбита, затем внешняя, внутри орбиты — по часовой стрелке","ветви до восемнадцати материалов показываются одной компактной С-образной орбитой; дополнительные орбиты появляются только у действительно больших разделов","радиус дочернего круга использует весь визуальный диапазон между самой короткой и самой длинной статьёй текущей ветви, поэтому различие объёма видно без расшифровки","точное время чтения сохранено внутри каждого узла, а легенда прямо объясняет масштаб, порядок и смысл соединительной линии","внутреннее кольцо прогресса и внешний пунктирный ореол удалены; у пузыря остался один функциональный контур с мягким свечением состояния","сокращены межузловые зазоры и поля холста, а автоматическое столкновение теперь только предотвращает наложения, не меняя понятный порядок"]}],"taxonomyExtensions":{"categories":[{"id":"proishozhdenie-tsivilizatsii-i-neoliticheskaya-revolyutsiya","mindmapGroup":"history-civilization","mindmapTitle":"Неолит и происхождение цивилизаций","description":"Переход от охоты и собирательства к производящему хозяйству, появление избытка, оседлости, специализации, собственности, городов и первых сложных общественных систем."},{"id":"resursy-energiya-progress-i-paradoks-dzhevonsa","mindmapGroup":"history-civilization","mindmapTitle":"Ресурсы, энергия и технологические переходы","description":"Как эффективность, доступная энергия, металл, инфраструктура и рост потребления меняют траекторию цивилизации, создавая одновременно новые возможности и новые зависимости."},{"id":"hrupkost-tsivilizatsii-klimat-i-stsenarii-upadka","mindmapGroup":"history-civilization","mindmapTitle":"Устойчивость, кризисы и упадок обществ","description":"Сложные связи между климатом, логистикой, демографией, доверием, технологиями и институтами, из-за которых локальный сбой способен перерасти в системный кризис."},{"id":"ierarhii-klassy-rabstvo-i-feodalnoe-obschestvo","mindmapGroup":"history-civilization","mindmapTitle":"Иерархии, сословия и экономика прошлого","description":"Власть, классы, рабство, феодальные отношения, налоги, земля, рынок труда и социальные обязательства как изменяющиеся механизмы организации общества."},{"id":"demografiya-rozhdaemost-i-depopulyatsiya","mindmapGroup":"history-civilization","mindmapTitle":"Рождаемость, смертность и демографические переходы","description":"Рождаемость, детская смертность, миграция, урбанизация, стоимость родительства и возрастная структура населения в разных исторических и современных условиях."},{"id":"arheologiya-datirovki-i-materialnye-sledy-proshlogo","mindmapGroup":"history-civilization","mindmapTitle":"Археология, датировки и материальные следы","description":"Контекст находки, стратиграфия, типология, независимые датировки, экспериментальная археология и следы производства как инструменты восстановления прошлого."},{"id":"istoricheskie-mify-alternativnaya-istoriya-i-kritika-istochnikov","mindmapGroup":"history-civilization","mindmapTitle":"Исторические мифы и критика источников","description":"Проверка эффектных исторических версий по происхождению источника, независимым свидетельствам, материальному контексту и способности объяснять неудобные данные."},{"id":"indoevropeytsy-step-kochevniki-i-proishozhdenie-narodov","mindmapGroup":"history-civilization","mindmapTitle":"Миграции, степь и происхождение народов","description":"Язык, археологическая культура, древняя ДНК, миграции степных обществ и политическая идентичность как разные уровни реконструкции происхождения населения."},{"id":"zdorove-trud-i-prodolzhitelnost-zhizni-v-proshlom","mindmapGroup":"history-civilization","mindmapTitle":"Здоровье, труд и продолжительность жизни","description":"Детская смертность, инфекции, травмы, питание, тяжёлый труд, рост и продолжительность жизни без мифа о едином коротком и одинаково нездоровом прошлом."},{"id":"pischevye-sistemy-zemledelie-i-hranenie-produktov","mindmapGroup":"history-civilization","mindmapTitle":"Пища, земледелие и хранение продуктов","description":"Сезонность, урожайность, животноводство, рыболовство, топливо, транспорт, переработка и запасы как единая система продовольственной устойчивости."},{"id":"zhilische-stroitelnye-materialy-i-evolyutsiya-poseleniy","mindmapGroup":"history-civilization","mindmapTitle":"Жилище, материалы и эволюция поселений","description":"Дом и поселение как компромисс между климатом, материалом, трудом, огнём, влагой, ремонтом, плотностью населения, инфраструктурой и угрозами."},{"id":"geologiya-klimat-i-landshafty-v-istorii-cheloveka","mindmapGroup":"history-civilization","mindmapTitle":"Геология, климат и исторические ландшафты","description":"Изменения морей, ледников, степей, лесов и речных систем, которые влияют на миграции, хозяйство, поселения и сохранность материальных следов прошлого."},{"id":"vyzhivanie-voda-eda-marshrut-i-avtonomnost","mindmapGroup":"material-survival","mindmapTitle":"Вода, маршрут, укрытие и автономность","description":"Приоритеты реальной аварийной ситуации, выбор маршрута, вода, укрытие, связь, сезон, состояние человека и соответствие снаряжения конкретной местности."},{"id":"bezopasnoe-zhilische-gorod-derevnya-i-postkatastroficheskaya-ustoychivost","mindmapGroup":"material-survival","mindmapTitle":"Безопасное жилище и устойчивость поселения","description":"Вода, снабжение, климат, плотность, маршруты выхода, соседи и ремонтопригодность, определяющие безопасность дома, деревни или города при сбоях."},{"id":"voyna-logistika-pehota-kavaleriya-i-kochevye-armii","mindmapGroup":"material-survival","mindmapTitle":"Армии, логистика и организация войны","description":"Набор людей, дисциплина, разведка, фураж, транспорт, время кампании, пехота, кавалерия и политические цели как условия реальной военной силы."},{"id":"kreposti-osady-i-voennaya-inzheneriya","mindmapGroup":"material-survival","mindmapTitle":"Крепости, осады и военная инженерия","description":"Фортификация как управление пространством и временем, где значение имеют место, вода, гарнизон, снабжение, связь, осадная техника и стоимость длительной блокады."},{"id":"mehanika-oruzhiya-materialy-i-kriterii-effektivnosti","mindmapGroup":"material-survival","mindmapTitle":"Механика оружия и критерии эффективности","description":"Оценка оружия по задаче, дистанции, энергии, контролю, цене, обучению, надёжности и компромиссам вместо рейтинга по устрашающему внешнему виду."},{"id":"mechi-sabli-i-evolyutsiya-klinkov","mindmapGroup":"material-survival","mindmapTitle":"Мечи, сабли и эволюция клинков","description":"Форма, материал, баланс, прочность, длина, масса и способ применения мечей, сабель, ножей и других клинков, созданных для разных боевых задач."},{"id":"topory-drevkovoe-i-udarnoe-oruzhie","mindmapGroup":"material-survival","mindmapTitle":"Топоры, копья и ударное оружие","description":"Дистанция, рычаг, доступные материалы и практические задачи копий, топоров, алебард, дубин и комбинированных форм вооружения."},{"id":"luki-arbalety-praschi-i-ranniy-ognestrel","mindmapGroup":"material-survival","mindmapTitle":"Луки, арбалеты, пращи и ранний огнестрел","description":"Дистанция, энергия, время подготовки, боеприпас, точность, обучение и снабжение в развитии метательного и раннего огнестрельного оружия."},{"id":"dospehi-schity-i-evolyutsiya-zaschity","mindmapGroup":"material-survival","mindmapTitle":"Доспехи, щиты и эволюция защиты","description":"Покрытие, подвижность, перегрев, цена, обслуживание и сочетание ткани, кожи, кольчуги, пластин и щитов против конкретных исторических угроз."},{"id":"istoricheskoe-fehtovanie-dueli-i-voinskaya-kultura","mindmapGroup":"material-survival","mindmapTitle":"Фехтование, дуэли и воинская культура","description":"Техника боя внутри правил, оружия, защиты и социальной нормы, различия между дуэлью, турниром, строем, самообороной и современной спортивной реконструкцией."},{"id":"informatsionnaya-inflyatsiya-i-hrupkost-znaniya","mindmapGroup":"society-ethics","mindmapTitle":"Информационная инфляция и хрупкость знания","description":"Как рост объёма публикаций, скорость распространения, конкуренция интерпретаций и удешевление производства контента меняют доверие, внимание и способность собирать устойчивую картину мира."},{"id":"povedencheskoe-obuchenie-i-podkreplenie","mindmapGroup":"behavior","mindmapTitle":"Подкрепление, шейпинг и изменение поведения","description":"Как последствия, точный момент обратной связи, последовательные приближения, сигналы и устройство среды формируют навыки и помогают менять поведение без угроз и принуждения."},{"id":"detskaya-privyazannost-i-vzroslenie","mindmapGroup":"relationships-family","mindmapTitle":"Привязанность, взросление и   <script>
    (() => {
      "use strict";

      const AUDIO_READER_ENABLED = true;
      const data = JSON.parse(document.getElementById("knowledge-data").textContent);
      const publicContent = data.meta.publicContent?.enabled
        ? data.meta.publicContent
        : null;
      const publicSync = data.meta.publicSync?.enabled
        ? data.meta.publicSync
        : null;
      const app = document.getElementById("app");
      document.getElementById("footer-stats").textContent =
        `${data.meta.sourceBookCount} источников · ${data.meta.canonicalTopicCount} тем · актуальная онлайн-редакция`;
      const topicBySlug = new Map(data.topics.map((topic) => [topic.slug, topic]));
      const bookById = new Map(data.books.map((book) => [book.id, book]));
      const categoryById = new Map(data.categories.map((category) => [category.id, category]));
      let topicCleanup = [];
      const accentClass = (color) => "accent-" + (color || "cyan");
      const e = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const normalize = (value) => String(value ?? "")
        .toLocaleLowerCase("ru")
        .replaceAll("ё", "е")
        .replace(/[^\p{L}\p{N}]+/gu, " ")
        .trim();
      const stripHtml = (value) => String(value ?? "")
        .replace(/<style[\s\S]*?<\/style>/gi, " ")
        .replace(/<[^>]+>/g, " ")
        .replaceAll("&nbsp;", " ")
        .replaceAll("&amp;", "&");

      const contentChunkPromises = new Map();
      let loadedContentChunks = 0;
      let backgroundContentStarted = false;

      function refreshTopicSearchIndex(topic) {
        topic.searchIndex = normalize([
          topic.title,
          topic.excerpt,
          (topic.tags || []).join(" "),
          (topic.aliases || []).join(" "),
          stripHtml(topic.bodyHtml),
          (topic.relatedVideos || []).map((video) => video.title).join(" "),
          (topic.articleSources || []).map((source) =>
            [source.title, source.sourceTitle, source.containerTitle, source.usedFor,
              ...(source.chapters || [])].filter(Boolean).join(" ")
          ).join(" "),
        ].join(" "));
      }

      function refreshContentLoadState() {
        const hosts = document.querySelectorAll("[data-content-load-state]");
        const total = publicContent?.chunks?.length || 0;
        const ready = !total || loadedContentChunks >= total;
        hosts.forEach((host) => {
          host.classList.toggle("is-ready", ready);
          host.textContent = ready
            ? "Все статьи готовы"
            : `Статьи загружаются в фоне · ${loadedContentChunks} из ${total}`;
        });
      }

      function mergeContentChunk(payload) {
        if (payload?.version !== publicContent?.version || !payload?.topics) {
          throw new Error("Получена несовместимая версия данных статьи.");
        }
        Object.entries(payload.topics).forEach(([slug, content]) => {
          const topic = topicBySlug.get(slug);
          if (!topic) return;
          Object.assign(topic, content);
          refreshTopicSearchIndex(topic);
        });
      }

      function loadContentChunk(relativePath) {
        if (!publicContent || !relativePath) return Promise.resolve();
        if (contentChunkPromises.has(relativePath)) {
          return contentChunkPromises.get(relativePath);
        }
        const promise = fetch(new URL(relativePath, document.baseURI), {
          credentials: "same-origin",
          cache: "force-cache",
        })
          .then((response) => {
            if (!response.ok) throw new Error(`Не удалось загрузить статью: ${response.status}`);
            return response.json();
          })
          .then((payload) => {
            mergeContentChunk(payload);
            loadedContentChunks += 1;
            refreshContentLoadState();
          })
          .catch((error) => {
            contentChunkPromises.delete(relativePath);
            refreshContentLoadState();
            throw error;
          });
        contentChunkPromises.set(relativePath, promise);
        return promise;
      }

      function ensureTopicContent(topic) {
        if (topic?.bodyHtml) return Promise.resolve(topic);
        if (!topic?.contentChunk) return Promise.reject(new Error("Для статьи не найден файл содержания."));
        return loadContentChunk(topic.contentChunk).then(() => topic);
      }

      function startBackgroundContentLoad() {
        if (!publicContent || backgroundContentStarted) return;
        backgroundContentStarted = true;
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (connection?.saveData || /(^|-)2g$/.test(connection?.effectiveType || "")) {
          refreshContentLoadState();
          return;
        }
        const queue = [...publicContent.chunks];
        const worker = async () => {
          while (queue.length) {
            const chunk = queue.shift();
            try { await loadContentChunk(chunk); } catch (_) {}
          }
        };
        const begin = () => Promise.all([worker(), worker()]);
        if ("requestIdleCallback" in window) {
          requestIdleCallback(begin, { timeout: Number(publicContent.backgroundDelayMs) || 850 });
        } else {
          setTimeout(begin, Number(publicContent.backgroundDelayMs) || 850);
        }
      }

      const revisionHost = document.getElementById("revision-drawer");
      const revisions = Array.isArray(data.meta.revisions)
        ? data.meta.revisions
        : [];
      if (revisionHost && revisions.length) {
        const latestRevision = revisions.at(-1);
        const parseRevisionDate = (value) => {
          const match = String(value || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
          if (!match) return null;
          const [, day, month, year] = match;
          const date = new Date(Number(year), Number(month) - 1, Number(day));
          if (
            date.getFullYear() !== Number(year) ||
            date.getMonth() !== Number(month) - 1 ||
            date.getDate() !== Number(day)
          ) return null;
          return {
            date,
            key: `${year}-${month}-${day}`,
          };
        };
        const revisionEntries = revisions
          .map((revision, index) => ({
            revision,
            index,
            parsed: parseRevisionDate(revision.date),
          }))
          .filter((entry) => entry.parsed);
        const revisionsByDate = new Map();
        revisionEntries.forEach((entry) => {
          const entries = revisionsByDate.get(entry.parsed.key) || [];
          entries.push(entry);
          revisionsByDate.set(entry.parsed.key, entries);
        });
        const revisionDateKeys = [...revisionsByDate.keys()].sort();
        const latestDateKey = parseRevisionDate(latestRevision.date)?.key || revisionDateKeys.at(-1);
        const earliestDate = revisionsByDate.get(revisionDateKeys[0])?.[0]?.parsed.date;
        const latestDate = revisionsByDate.get(revisionDateKeys.at(-1))?.[0]?.parsed.date;
        const revisionYears = [...new Set(revisionEntries.map((entry) => entry.parsed.date.getFullYear()))].sort();
        const revisionMonthNames = Array.from({ length: 12 }, (_, month) =>
          new Intl.DateTimeFormat("ru-RU", { month: "long" }).format(new Date(2026, month, 1)),
        );
        let revisionSelectionMode = "day";
        let selectedRevisionDate = latestDateKey;
        let revisionRangeStart = null;
        let revisionRangeEnd = null;
        let revisionCalendarCursor = new Date(
          latestDate.getFullYear(),
          latestDate.getMonth(),
          1,
        );
        const revisionMonthFormatter = new Intl.DateTimeFormat("ru-RU", {
          month: "long",
          year: "numeric",
        });
        const revisionDateFormatter = new Intl.DateTimeFormat("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        const cleanRevisionDate = (date) => revisionDateFormatter
          .format(date)
          .replace(" г.", "");
        const revisionDateKey = (date) => [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
        const revisionCountLabel = (count) => {
          const tail = count % 10;
          const lastTwo = count % 100;
          if (tail === 1 && lastTwo !== 11) return `${count} изменение`;
          if (tail >= 2 && tail <= 4 && (lastTwo < 12 || lastTwo > 14)) return `${count} изменения`;
          return `${count} изменений`;
        };
        const revisionCardHtml = ({ revision, index }) => {
          const current =
            revision.id === data.meta.revisionId ||
            index === revisions.length - 1;
          return `
            <article class="revision-card${current ? " is-current" : ""}">
              <div class="revision-card-head">
                <span>${String(index + 1).padStart(2, "0")} · ${e(revision.date)}</span>
                <span>${current ? "текущая" : "архив"}</span>
              </div>
              <h3>${e(revision.title)}</h3>
              <p>${e(revision.description)}</p>
              ${revision.changes?.length ? `<ul>${revision.changes.map((change) => `<li>${e(change)}</li>`).join("")}</ul>` : ""}
            </article>`;
        };
        revisionHost.innerHTML = `
          <details class="revision-details">
            <summary class="revision-summary">
              <strong>История редакций</strong>
              <span>${revisions.length} этапов · ${revisionDateKeys.length} дат · выберите день в календаре</span>
