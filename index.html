      function bubbleNodeSvg(node, order) {
        const radius = node.r;
        const compact = radius < 72;
        const labelLimit = Math.max(10, Math.floor(radius * (compact ? .17 : .19)));
        const titleLines = wrapMapLabel(node.title, labelLimit, 3);
        const baseTitleSize = node.type === "root" || node.type === "focus"
          ? Math.min(21, 16.5 + radius * .027)
          : Math.min(17.5, 11.5 + radius * .055);
        const preferredTitleSize = titleLines.length >= 3
          ? Math.max(11.6, baseTitleSize - 1.15)
          : baseTitleSize;
        const longestLine = Math.max(...titleLines.map((line) => line.length), 1);
        const widthFittedTitleSize = radius * 1.45 / (longestLine * .58);
        const geometricTitleSize = (radius - 11) / Math.hypot(
          longestLine * .3,
          titleLines.length * .62,
        );
        const titleSize = Math.max(
          node.type === "topic" ? 10.6 : 10.8,
          Math.min(preferredTitleSize, widthFittedTitleSize, geometricTitleSize),
        );
        const lineHeight = titleSize * 1.08;
        const firstLineY = -((titleLines.length - 1) * lineHeight) / 2 + 3;
        const driftAngle = ((order * 137.5) % 360) * Math.PI / 180;
        const driftX = (Math.cos(driftAngle) * 2.2).toFixed(2);
        const driftY = (Math.sin(driftAngle) * 2.2).toFixed(2);
        const classes = [
          "mindmap-node",
          "mindmap-bubble",
          node.className,
          node.selected ? "is-selected" : "",
        ].filter(Boolean).join(" ");
        return `
          <g class="${classes}" ${node.dataAttribute} data-map-node-id="${e(node.id)}"
            data-bubble-radius="${radius.toFixed(2)}" data-reading-volume="${Math.round(node.value)}"
            tabindex="0" role="${node.role}" aria-label="${e(node.label)}"
            transform="translate(${node.x.toFixed(2)} ${node.y.toFixed(2)})"
            style="--node-color:${node.color};--bubble-title-size:${titleSize.toFixed(2)}px;--bubble-drift-x:${driftX}px;--bubble-drift-y:${driftY}px;--bubble-float-duration:${(4.8 + (order % 5) * .48).toFixed(2)}s;--bubble-float-delay:${(-order * .21).toFixed(2)}s">
            <g class="mindmap-node-repel">
              <g class="mindmap-node-motion">
                <g class="mindmap-node-float">
                  <title>${e(node.title)} · ${e(node.meta)}</title>
                  <circle class="node-surface" r="${radius.toFixed(2)}"/>
                  <text class="node-code" x="0" y="${(-radius * .54).toFixed(2)}">${e(node.code)}</text>
                  ${mapTextLines(titleLines, 0, firstLineY, "node-title", lineHeight)}
                  <text class="node-meta" x="0" y="${(radius * .61).toFixed(2)}">${e(node.meta)}</text>
                </g>
              </g>
            </g>
          </g>`;
      }

      function bubbleHash(value) {
        let hash = 2166136261;
        for (const character of String(value)) {
          hash ^= character.codePointAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function settleBubbleNodes(nodes, width, height) {
        const padding = 18;

        for (let tick = 0; tick < 260; tick += 1) {
          const cooling = 1 - tick / 300;
          nodes.forEach((node) => {
            if (node.locked) return;
            node.x += (node.targetX - node.x) * .055 * cooling;
            node.y += (node.targetY - node.y) * .055 * cooling;
          });

          for (let left = 0; left < nodes.length; left += 1) {
            for (let right = left + 1; right < nodes.length; right += 1) {
              const a = nodes[left];
              const b = nodes[right];
              let dx = b.x - a.x;
              let dy = b.y - a.y;
              let distance = Math.hypot(dx, dy);
              if (distance < .01) {
                const angle = ((bubbleHash(`${a.id}:${b.id}`) % 628) / 100);
                dx = Math.cos(angle);
                dy = Math.sin(angle);
                distance = 1;
              }
              const required = a.r + b.r + (a.type === "context" || b.type === "context" ? 14 : 10);
              if (distance >= required) continue;
              const overlap = (required - distance) * .54;
              const ux = dx / distance;
              const uy = dy / distance;
              if (!a.locked && !b.locked) {
                a.x -= ux * overlap * .5;
                a.y -= uy * overlap * .5;
                b.x += ux * overlap * .5;
                b.y += uy * overlap * .5;
              } else if (!a.locked) {
                a.x -= ux * overlap;
                a.y -= uy * overlap;
              } else if (!b.locked) {
                b.x += ux * overlap;
                b.y += uy * overlap;
              }
            }
          }

          nodes.forEach((node) => {
            if (node.locked) return;
            node.x = Math.max(padding + node.r, Math.min(width - padding - node.r, node.x));
            node.y = Math.max(padding + node.r, Math.min(height - padding - node.r, node.y));
          });
        }
        return nodes;
      }

      function assignOrderedBubbleOrbits(nodes, centerX, centerY, focusRadius, {
        fullCircle = false,
        gap = 16,
      } = {}) {
        const availableAngle = fullCircle ? Math.PI * 2 : Math.PI * 1.48;
        if (nodes.length <= 18) {
          const maximumRadius = Math.max(...nodes.map((node) => node.r), 1);
          const requiredArcLength = nodes.reduce((sum, node) => sum + node.r * 2 + gap, 0);
          const ringRadius = Math.max(
            focusRadius + maximumRadius + gap,
            requiredArcLength / (availableAngle * .9),
          );
          let angles;
          if (!fullCircle && nodes.length <= 3) {
            angles = nodes.length === 1
              ? [0]
              : nodes.length === 2
                ? [-.55, .55]
                : [-.78, 0, .78];
          } else {
            const usedAngle = fullCircle
              ? Math.PI * 2
              : Math.min(availableAngle, requiredArcLength / ringRadius);
            const weights = nodes.map((node) => node.r * 2 + gap);
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let accumulated = 0;
            angles = weights.map((weight) => {
              const angle = (fullCircle ? -Math.PI / 2 : -usedAngle / 2)
                + (accumulated + weight / 2) / totalWeight * usedAngle;
              accumulated += weight;
              return angle;
            });
          }
          nodes.forEach((node, index) => {
            node.targetX = centerX + Math.cos(angles[index]) * ringRadius;
            node.targetY = centerY + Math.sin(angles[index]) * ringRadius;
            node.x = node.targetX;
            node.y = node.targetY;
          });
          return;
        }

        let cursor = 0;
        let innerBoundary = focusRadius + gap;
        while (cursor < nodes.length) {
          const ringNodes = [];
          let maximumRadius = nodes[cursor].r;
          let usedAngle = 0;
          while (cursor < nodes.length) {
            const candidate = nodes[cursor];
            maximumRadius = Math.max(maximumRadius, candidate.r);
            const ringRadius = innerBoundary + maximumRadius;
            const angularWidth = 2 * Math.asin(Math.min(.92, (candidate.r + gap * .55) / ringRadius));
            if (ringNodes.length && usedAngle + angularWidth > availableAngle * .9) break;
            ringNodes.push(candidate);
            usedAngle += angularWidth;
            cursor += 1;
          }

          const ringRadius = innerBoundary + maximumRadius;
          let angles;
          if (!fullCircle && ringNodes.length <= 3) {
            angles = ringNodes.length === 1
              ? [0]
              : ringNodes.length === 2
                ? [-.55, .55]
                : [-.78, 0, .78];
          } else if (fullCircle) {
            angles = ringNodes.map((_, index) => -Math.PI / 2 + index * Math.PI * 2 / ringNodes.length);
          } else {
            const arc = Math.max(Math.PI * .92, Math.min(Math.PI * 1.48, usedAngle * 1.22));
            angles = ringNodes.map((_, index) =>
              ringNodes.length === 1 ? 0 : -arc / 2 + index * arc / (ringNodes.length - 1),
            );
          }
          ringNodes.forEach((node, index) => {
            node.targetX = centerX + Math.cos(angles[index]) * ringRadius;
            node.targetY = centerY + Math.sin(angles[index]) * ringRadius;
            node.x = node.targetX;
            node.y = node.targetY;
          });
          innerBoundary = ringRadius + maximumRadius + gap;
        }
      }

      function placeBubbleContext(contextNode, focusNode, gap = 32) {
        contextNode.targetX = focusNode.targetX - focusNode.r - contextNode.r - gap;
        contextNode.targetY = focusNode.targetY;
        contextNode.x = contextNode.targetX;
        contextNode.y = contextNode.targetY;
      }

      function compactBubbleLayout(nodes, minimumWidth, minimumHeight, margin = 46) {
        const minimumX = Math.min(...nodes.map((node) => node.targetX - node.r));
        const maximumX = Math.max(...nodes.map((node) => node.targetX + node.r));
        const minimumY = Math.min(...nodes.map((node) => node.targetY - node.r));
        const maximumY = Math.max(...nodes.map((node) => node.targetY + node.r));
        const spanWidth = maximumX - minimumX;
        const spanHeight = maximumY - minimumY;
        const width = Math.max(minimumWidth, spanWidth + margin * 2);
        const height = Math.max(minimumHeight, spanHeight + margin * 2);
        const shiftX = (width - spanWidth) / 2 - minimumX;
        const shiftY = (height - spanHeight) / 2 - minimumY;
        nodes.forEach((node) => {
          node.targetX += shiftX;
          node.targetY += shiftY;
          node.x = node.targetX;
          node.y = node.targetY;
        });
        return { width, height };
      }

      function bubbleLinkPath(source, target, bend = 0) {
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / distance;
        const uy = dy / distance;
        const startX = source.x + ux * (source.r + 5);
        const startY = source.y + uy * (source.r + 5);
        const endX = target.x - ux * (target.r + 5);
        const endY = target.y - uy * (target.r + 5);
        const curve = Math.max(-46, Math.min(46, bend));
        const controlX = (startX + endX) / 2 - uy * curve;
        const controlY = (startY + endY) / 2 + ux * curve;
        return `M ${startX.toFixed(2)} ${startY.toFixed(2)} Q ${controlX.toFixed(2)} ${controlY.toFixed(2)} ${endX.toFixed(2)} ${endY.toFixed(2)}`;
      }

      function renderBubbleGraph(layout, edges, nodes, points) {
        settleBubbleNodes(layout.nodes, layout.width, layout.height);
        const byId = new Map(layout.nodes.map((node) => [node.id, node]));
        layout.links.forEach((link, index) => {
          const source = byId.get(link.source);
          const target = byId.get(link.target);
          if (!source || !target) return;
          link.bend = link.context ? 0 : (index % 2 ? 10 : -10);
          const classes = [
            "mindmap-edge",
            "mindmap-edge--bubble",
            link.context ? "mindmap-edge--bubble-context mindmap-edge--context" : "",
          ].filter(Boolean).join(" ");
          edges.push(`<path class="${classes}" data-map-edge-source="${e(link.source)}" data-map-edge-target="${e(link.target)}" data-map-edge-sequence="${link.sequence ? "true" : "false"}" d="${bubbleLinkPath(source, target, link.bend)}" stroke="${target.color}" style="color:${target.color};--map-delay:${Math.min(index * 10, 180)}ms"/>`);
        });
        layout.nodes.forEach((node, index) => {
          nodes.push(bubbleNodeSvg(node, index));
          points.push({ x: node.x, y: node.y, color: node.color, r: Math.max(3, node.r / 17) });
        });
        mapState.bubbleLayout = layout;
        return { width: layout.width, height: layout.height };
      }

      function bubbleGroupNode(group, index, minimum, maximum, targetX = 0, targetY = 0) {
        const color = mapColors[group.definition.color] || mapColors.cyan;
        const radius = bubbleRadius(group.readingMinutes, minimum, maximum, 72, 122);
        return bubbleNode({
          id: `group:${group.definition.id}`,
          type: "group",
          className: "mindmap-group",
          dataAttribute: `data-map-group="${e(group.definition.id)}"`,
          title: group.definition.title,
          code: `${group.definition.code} · КОНТУР`,
          meta: `${group.topicCount} тем · ${bubbleTimeLabel(group.readingMinutes)}`,
          color,
          radius,
          targetX,
          targetY,
          value: group.readingMinutes,
          maximum,
          label: `Исследовать контур ${group.definition.title}, ${bubbleTimeLabel(group.readingMinutes)} чтения`,
        });
      }

      function renderBubbleMindmapRoot(groups, edges, nodes, points) {
        const mobile = window.innerWidth < 640;
        const centerX = 0;
        const centerY = 0;
        const minimum = Math.min(...groups.map((group) => group.readingMinutes)) || 1;
        const maximum = Math.max(...groups.map((group) => group.readingMinutes), 1);
        const root = bubbleNode({
          id: "root",
          type: "root",
          className: "mindmap-root mindmap-focus is-selected",
          dataAttribute: "data-map-root",
          title: "База знаний",
          code: `ROOT · ${data.meta.canonicalTopicCount} ТЕМ`,
          meta: `${mindmapGroups.length} контуров`,
          color: mapColors.cyan,
          radius: mobile ? 104 : 116,
          targetX: centerX,
          targetY: centerY,
          value: data.topics.reduce((sum, topic) => sum + topic.readingMinutes, 0),
          maximum: data.topics.reduce((sum, topic) => sum + topic.readingMinutes, 0),
          selected: true,
          locked: true,
          label: "Обзор базы знаний",
        });
        const childNodes = groups.map((group, index) =>
          bubbleGroupNode(group, index, minimum, maximum),
        );
        assignOrderedBubbleOrbits(childNodes, centerX, centerY, root.r, { fullCircle: true, gap: mobile ? 15 : 18 });
        const dimensions = compactBubbleLayout(
          [root, ...childNodes],
          mobile ? 860 : 1260,
          mobile ? 1080 : 790,
        );
        const layout = {
          ...dimensions,
          focusId: root.id,
          nodes: [root, ...childNodes],
          links: childNodes.map((node) => ({ source: root.id, target: node.id })),
        };
        return renderBubbleGraph(layout, edges, nodes, points);
      }

      function renderBubbleMindmapGroup(group, edges, nodes, points) {
        const mobile = window.innerWidth < 640;
        const centerX = 0;
        const centerY = 0;
        const groupColor = mapColors[group.definition.color] || mapColors.cyan;
        const categoryMinutes = group.categories.map((item) =>
          item.topics.reduce((sum, topic) => sum + topic.readingMinutes, 0),
        );
        const minimum = Math.min(...categoryMinutes) || 1;
        const maximum = Math.max(...categoryMinutes, 1);
        const focus = bubbleNode({
          id: `group:${group.definition.id}`,
          type: "focus",
          className: "mindmap-group mindmap-focus is-selected",
          dataAttribute: `data-map-group="${e(group.definition.id)}"`,
          title: group.definition.title,
          code: `${group.definition.code} · АКТИВНЫЙ КОНТУР`,
          meta: `${group.topicCount} тем · ${bubbleTimeLabel(group.readingMinutes)}`,
          color: groupColor,
          radius: mobile ? 112 : 124,
          targetX: centerX,
          targetY: centerY,
          value: group.readingMinutes,
          maximum: group.readingMinutes,
          selected: true,
          locked: true,
          label: `Активный контур ${group.definition.title}`,
        });
        const root = bubbleNode({
          id: "root",
          type: "context",
          className: "mindmap-root mindmap-context-node",
          dataAttribute: "data-map-root",
          title: "База знаний",
          code: "ROOT · НАЗАД",
          meta: `${data.meta.canonicalTopicCount} тем`,
          color: mapColors.cyan,
          radius: 68,
          targetX: 0,
          targetY: 0,
          value: 1,
          maximum: 1,
          locked: true,
          label: "Вернуться к обзору базы знаний",
        });
        const categoryNodes = group.categories.map((item, index) => {
          const minutes = categoryMinutes[index];
          const color = mapColors[item.category.color] || groupColor;
          return bubbleNode({
            id: `category:${item.category.id}`,
            type: "category",
            className: "mindmap-category",
            dataAttribute: `data-map-category="${e(item.category.id)}"`,
            title: mindmapCategoryTitle(item.category),
            code: `${item.category.code} · ВЕТВЬ`,
            meta: `${item.topics.length} тем · ${bubbleTimeLabel(minutes)}`,
            color,
            radius: bubbleRadius(minutes, minimum, maximum, 64, 114),
            targetX: 0,
            targetY: 0,
            value: minutes,
            maximum,
            label: `Открыть ветвь ${mindmapCategoryTitle(item.category)}, ${bubbleTimeLabel(minutes)} чтения`,
          });
        });
        assignOrderedBubbleOrbits(categoryNodes, centerX, centerY, focus.r, { gap: mobile ? 14 : 16 });
        placeBubbleContext(root, focus, mobile ? 26 : 32);
        const dimensions = compactBubbleLayout(
          [root, focus, ...categoryNodes],
          mobile ? 860 : 1180,
          mobile ? 1040 : 740,
        );
        const layout = {
          ...dimensions,
          focusId: focus.id,
          nodes: [root, focus, ...categoryNodes],
          links: [
            { source: root.id, target: focus.id, context: true },
            ...categoryNodes.map((node) => ({ source: focus.id, target: node.id })),
          ],
        };
        return renderBubbleGraph(layout, edges, nodes, points);
      }

      function renderBubbleMindmapCategory(group, item, edges, nodes, points) {
        const topics = item.topics;
        const mobile = window.innerWidth < 640;
        const centerX = 0;
        const centerY = 0;
        const groupColor = mapColors[group.definition.color] || mapColors.cyan;
        const categoryColor = mapColors[item.category.color] || groupColor;
        const minimum = Math.min(...topics.map((topic) => topic.readingMinutes)) || 1;
        const maximum = Math.max(...topics.map((topic) => topic.readingMinutes), 1);
        const focusMinutes = topics.reduce((sum, topic) => sum + topic.readingMinutes, 0);
        const focus = bubbleNode({
          id: `category:${item.category.id}`,
          type: "focus",
          className: "mindmap-category mindmap-focus is-selected",
          dataAttribute: `data-map-category="${e(item.category.id)}"`,
          title: mindmapCategoryTitle(item.category),
          code: `${item.category.code} · АКТИВНАЯ ВЕТВЬ`,
          meta: `${topics.length} тем · ${bubbleTimeLabel(focusMinutes)}`,
          color: categoryColor,
          radius: mobile ? 114 : 126,
          targetX: centerX,
          targetY: centerY,
          value: focusMinutes,
          maximum: focusMinutes,
          selected: true,
          locked: true,
          label: `Активная ветвь ${mindmapCategoryTitle(item.category)}`,
        });
        const parent = bubbleNode({
          id: `group:${group.definition.id}`,
          type: "context",
          className: "mindmap-group mindmap-context-node",
          dataAttribute: `data-map-group="${e(group.definition.id)}"`,
          title: group.definition.title,
          code: `${group.definition.code} · НАЗАД`,
          meta: `${group.topicCount} тем`,
          color: groupColor,
          radius: 68,
          targetX: 0,
          targetY: 0,
          value: group.readingMinutes,
          maximum: group.readingMinutes,
          locked: true,
          label: `Вернуться к контуру ${group.definition.title}`,
        });
        const topicNodes = topics.map((topic, index) => {
          const selected = topic.slug === mapState.selectedTopicSlug;
          const radiusByVolume = bubbleRadius(topic.readingMinutes, minimum, maximum, 62, 112);
          const isMatch = Boolean(mapState.query.trim()) && normalize(mapState.query)
            .split(" ")
            .filter(Boolean)
            .every((term) => topic.searchIndex.includes(term));
          return bubbleNode({
            id: `topic:${topic.slug}`,
            type: "topic",
            className: `mindmap-topic${isMatch ? " is-match" : ""}`,
            dataAttribute: `data-map-topic="${e(topic.slug)}"`,
            title: topic.title,
            code: `${String(index + 1).padStart(2, "0")} · ТЕМА`,
            meta: `${topic.readingMinutes} мин`,
            color: categoryColor,
            radius: radiusByVolume,
            targetX: 0,
            targetY: 0,
            value: topic.readingMinutes,
            maximum,
            selected,
            role: "link",
            label: `${selected ? "Открыть" : "Выбрать"} тему ${topic.title}, ${topic.readingMinutes} минут чтения`,
          });
        });
        assignOrderedBubbleOrbits(topicNodes, centerX, centerY, focus.r, { gap: mobile ? 13 : 15 });
        placeBubbleContext(parent, focus, mobile ? 26 : 32);
        const dimensions = compactBubbleLayout(
          [parent, focus, ...topicNodes],
          mobile ? 880 : 1180,
          mobile ? 1080 : 760,
        );
        const layout = {
          ...dimensions,
          focusId: focus.id,
          nodes: [parent, focus, ...topicNodes],
          links: [
            { source: parent.id, target: focus.id, context: true },
            ...topicNodes.map((node, index) => ({
              source: index ? topicNodes[index - 1].id : focus.id,
              target: node.id,
              sequence: true,
            })),
          ],
        };
        return renderBubbleGraph(layout, edges, nodes, points);
      }

      function updateBubbleLayoutFrame(layout, progress) {
        const layer = document.getElementById("mindmap-layer");
        if (!layer || !layout) return;
        const focus = layout.nodes.find((node) => node.id === layout.focusId) || layout.nodes[0];
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = new Map();
        layout.nodes.forEach((node) => {
          const factor = node.locked ? 1 : .77 + .23 * eased;
          const x = focus.x + (node.x - focus.x) * factor;
          const y = focus.y + (node.y - focus.y) * factor;
          current.set(node.id, { ...node, x, y });
          layer.querySelector(`[data-map-node-id="${CSS.escape(node.id)}"]`)
            ?.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
        });
        layout.links.forEach((link) => {
          const source = current.get(link.source);
          const target = current.get(link.target);
          const edge = layer.querySelector(`[data-map-edge-source="${CSS.escape(link.source)}"][data-map-edge-target="${CSS.escape(link.target)}"]`);
          if (source && target && edge) {
            edge.setAttribute("d", bubbleLinkPath(source, target, link.bend));
          }
        });
      }

      function animateMindmapBubbles() {
        if (mapState.bubbleAnimationFrame) {
          cancelAnimationFrame(mapState.bubbleAnimationFrame);
          mapState.bubbleAnimationFrame = null;
        }
        const layout = mapState.bubbleLayout;
        if (!layout) return;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          updateBubbleLayoutFrame(layout, 1);
          return;
        }
        const started = performance.now();
        const duration = 520;
        const frame = (now) => {
          const progress = Math.min(1, (now - started) / duration);
          updateBubbleLayoutFrame(layout, progress);
          if (progress < 1) {
            mapState.bubbleAnimationFrame = requestAnimationFrame(frame);
          } else {
            mapState.bubbleAnimationFrame = null;
          }
        };
        updateBubbleLayoutFrame(layout, 0);
        mapState.bubbleAnimationFrame = requestAnimationFrame(frame);
      }

      function clearMindmapBubbleFocus() {
        const layer = document.getElementById("mindmap-layer");
        if (!layer) return;
        layer.classList.remove("has-bubble-focus");
        layer.querySelectorAll(".is-bubble-focus, .is-bubble-context").forEach((element) =>
          element.classList.remove("is-bubble-focus", "is-bubble-context"),
        );
        layer.querySelectorAll(".mindmap-node-repel").forEach((element) => {
          element.style.transform = "";
        });
      }

      function focusMindmapBubble(nodeElement) {
        const layer = document.getElementById("mindmap-layer");
        const layout = mapState.bubbleLayout;
        if (!layer || !layout || !nodeElement) return;
        clearMindmapBubbleFocus();
        const activeId = nodeElement.dataset.mapNodeId;
        const active = layout.nodes.find((node) => node.id === activeId);
        if (!active) return;
        layer.classList.add("has-bubble-focus");
        nodeElement.classList.add("is-bubble-focus");
        const connected = new Set([activeId]);
        layout.links.forEach((link) => {
          if (link.source !== activeId && link.target !== activeId) return;
          connected.add(link.source);
          connected.add(link.target);
          layer.querySelector(`[data-map-edge-source="${CSS.escape(link.source)}"][data-map-edge-target="${CSS.escape(link.target)}"]`)
            ?.classList.add("is-bubble-focus");
        });
        connected.forEach((id) => {
          if (id === activeId) return;
          layer.querySelector(`[data-map-node-id="${CSS.escape(id)}"]`)
            ?.classList.add("is-bubble-context");
        });
        layout.nodes.forEach((node) => {
          if (node.id === activeId || connected.has(node.id) || node.locked) return;
          const dx = node.x - active.x;
          const dy = node.y - active.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const range = active.r + node.r + 150;
          if (distance >= range) return;
          const force = (1 - distance / range) * 12;
          const repel = layer.querySelector(`[data-map-node-id="${CSS.escape(node.id)}"] .mindmap-node-repel`);
          if (repel) {
            repel.style.transform = `translate(${(dx / distance * force).toFixed(2)}px, ${(dy / distance * force).toFixed(2)}px)`;
          }
        });
      }

      function currentMindmapContext() {
        const groups = getMindmapGroups();
        const group =
          groups.find((item) => item.definition.id === mapState.activeGroupId) ||
          null;
        const categoryItem =
          group?.categories.find(
            (item) => item.category.id === mapState.activeCategoryId,
          ) || null;
        return { groups, group, categoryItem };
      }

      function applyMindmapTransform() {
        const layer = document.getElementById("mindmap-layer");
        if (!layer) return;
        layer.setAttribute(
          "transform",
          `translate(${mapState.x} ${mapState.y}) scale(${mapState.scale})`,
        );
        updateMindmapMinimap();
      }

      function fitMindmap() {
        const viewport = document.getElementById("mindmap-viewport");
        if (!viewport) return;
        const width = viewport.clientWidth;
        const height = viewport.clientHeight;
        const calculated = Math.min(
          .95,
          (width - 42) / mapState.layoutWidth,
          (height - 42) / mapState.layoutHeight,
        );
        const minimumReadableScale = width < 640 ? .46 : .42;
        mapState.scale = Math.max(minimumReadableScale, calculated);
        mapState.x =
          (width - mapState.layoutWidth * mapState.scale) / 2 -
          mapState.layoutMinX * mapState.scale;
        const scaledHeight = mapState.layoutHeight * mapState.scale;
        mapState.y =
          scaledHeight > height
            ? 18
            : (height - scaledHeight) / 2;
        applyMindmapTransform();
      }

      function zoomMindmap(factor, clientX, clientY) {
        const viewport = document.getElementById("mindmap-viewport");
        if (!viewport) return;
        const rect = viewport.getBoundingClientRect();
        const pointX = clientX == null ? viewport.clientWidth / 2 : clientX - rect.left;
        const pointY = clientY == null ? viewport.clientHeight / 2 : clientY - rect.top;
        const nextScale = Math.max(.3, Math.min(2.25, mapState.scale * factor));
        const ratio = nextScale / mapState.scale;
        mapState.x = pointX - (pointX - mapState.x) * ratio;
        mapState.y = pointY - (pointY - mapState.y) * ratio;
        mapState.scale = nextScale;
        applyMindmapTransform();
      }

      function updateMindmapMinimap() {
        const minimap = document.getElementById("mindmap-minimap-svg");
        const viewport = document.getElementById("mindmap-viewport");
        if (!minimap || !viewport || !mapState.nodePoints.length) return;
        const miniWidth = 160;
        const miniHeight = 100;
        const padding = 5;
        const scaleX = (miniWidth - padding * 2) / mapState.layoutWidth;
        const scaleY = (miniHeight - padding * 2) / mapState.layoutHeight;
        const dots = mapState.nodePoints.map((point) =>
          `<circle class="mindmap-minimap-node" cx="${padding + (point.x - mapState.layoutMinX) * scaleX}" cy="${padding + point.y * scaleY}" r="${Math.max(1.4, point.r * .45)}" style="--mini-color:${point.color}"/>`,
        ).join("");
        const worldX = (-mapState.x / mapState.scale) - mapState.layoutMinX;
        const worldY = -mapState.y / mapState.scale;
        const visibleWidth = viewport.clientWidth / mapState.scale;
        const visibleHeight = viewport.clientHeight / mapState.scale;
        const frameX = padding + Math.max(0, worldX) * scaleX;
        const frameY = padding + Math.max(0, worldY) * scaleY;
        const frameWidth = Math.min(
          miniWidth - padding * 2,
          Math.max(8, visibleWidth * scaleX),
        );
        const frameHeight = Math.min(
          miniHeight - padding * 2,
          Math.max(8, visibleHeight * scaleY),
        );
        minimap.innerHTML = `${dots}<rect class="mindmap-minimap-frame" x="${frameX}" y="${frameY}" width="${frameWidth}" height="${frameHeight}" rx="2"/>`;
      }

      function mindmapBreadcrumbsHtml(group, categoryItem) {
        const items = [
          `<button class="mindmap-crumb" type="button" data-map-breadcrumb="root"${mapState.mode === "root" ? ' aria-current="page"' : ""}>База знаний</button>`,
        ];
        if (group) {
          items.push(
            `<span class="mindmap-crumb-sep">›</span>`,
            `<button class="mindmap-crumb" type="button" data-map-breadcrumb="group" data-group-id="${e(group.definition.id)}"${mapState.mode === "group" ? ' aria-current="page"' : ""}>${e(group.definition.title)}</button>`,
          );
        }
        if (categoryItem) {
          items.push(
            `<span class="mindmap-crumb-sep">›</span>`,
            `<button class="mindmap-crumb" type="button" data-map-breadcrumb="category" data-category-id="${e(categoryItem.category.id)}" aria-current="page">${e(mindmapCategoryTitle(categoryItem.category))}</button>`,
          );
        }
        return items.join("");
      }

      function renderMindmapInspector(type = mapState.inspector.type, id = mapState.inspector.id) {
        const inspector = document.getElementById("mindmap-inspector");
        if (!inspector) return;
        if (
          inspector.children.length &&
          inspector.dataset.inspectorType === type &&
          inspector.dataset.inspectorId === String(id)
        ) return;
        const { groups, group: activeGroup, categoryItem: activeCategory } =
          currentMindmapContext();
        let color = mapColors.cyan;
        let code = "NAVIGATION CORE";
        let title = "База знаний";
        let description =
          `Выберите один из ${mindmapGroups.length} смысловых контуров. Карта перестроится вокруг выбранного узла, сохранив путь назад и показав следующий уровень.`;
        let primary = mindmapGroups.length;
        let primaryLabel = "контуров";
        let secondary = data.meta.canonicalTopicCount;
        let secondaryLabel = "тем";
        let path = "Обзор → контур → ветвь → статья";
        let action = "";

        if (type === "group") {
          const group = groups.find((item) => item.definition.id === id);
          if (group) {
            color = mapColors[group.definition.color] || color;
            code = `${group.definition.code} · СМЫСЛОВОЙ КОНТУР`;
            title = group.definition.title;
            description =
              mindmapGroupDescriptions[group.definition.id] ||
              "Связанные области знаний собраны в один навигационный контур.";
            primary = group.categories.length;
            primaryLabel = "ветвей";
            secondary = group.topicCount;
            secondaryLabel = "тем";
            path = `База знаний → ${group.definition.title}`;
            action = `<button class="mindmap-inspector-action" type="button" data-inspector-action="group" data-group-id="${e(group.definition.id)}">Исследовать контур →</button>`;
          }
        }

        if (type === "category") {
          const group = groupForCategory(id);
          const item = group?.categories.find(
            (candidate) => candidate.category.id === id,
          );
          if (group && item) {
            color = mapColors[item.category.color] || mapColors[group.definition.color] || color;
            code = `${item.category.code} · ТЕМАТИЧЕСКАЯ ВЕТВЬ`;
            title = mindmapCategoryTitle(item.category);
            description = `${mindmapCategoryDescriptions[item.category.id] || "Связанные материалы собраны вокруг одной практической задачи."} В ветви — ${independentArticleCount(item.topics.length)}.`;
            primary = item.topics.length;
            primaryLabel = "тем";
            secondary = item.topics.reduce(
              (sum, topic) => sum + topic.readingMinutes,
              0,
            );
            secondaryLabel = "минут чтения";
            path = `База знаний → ${group.definition.title} → ${mindmapCategoryTitle(item.category)}`;
            action = `<button class="mindmap-inspector-action" type="button" data-inspector-action="category" data-category-id="${e(item.category.id)}">Открыть ветвь →</button>`;
          }
        }

        if (type === "topic") {
          const topic = topicBySlug.get(id);
          const category = topic ? categoryById.get(topic.primaryCategoryId) : null;
          const group = category ? groupForCategory(category.id) : null;
          if (topic && category && group) {
            color = mapColors[category.color] || mapColors[group.definition.color] || color;
            code = `${category.code} · СТАТЬЯ`;
            title = topic.title;
            description = topic.excerpt;
            primary = topic.readingMinutes;
            primaryLabel = "минут чтения";
            secondary = topic.bookIds.length;
            secondaryLabel = topic.bookIds.length === 1 ? "источник" : "источника";
            path = `База знаний → ${group.definition.title} → ${mindmapCategoryTitle(category)} → ${topic.title}`;
            action = `<button class="mindmap-inspector-action" type="button" data-inspector-action="topic" data-topic-slug="${e(topic.slug)}">Читать статью →</button>`;
          }
        }

        mapState.inspector = { type, id };
        inspector.dataset.inspectorType = type;
        inspector.dataset.inspectorId = String(id);
        inspector.style.setProperty("--inspector-color", color);
        inspector.innerHTML = `
          <span class="mindmap-inspector-code">${e(code)}</span>
          <h3>${e(title)}</h3>
          <p>${e(description)}</p>
          <div class="mindmap-inspector-stats">
            <div class="mindmap-inspector-stat"><strong>${primary}</strong><span>${e(primaryLabel)}</span></div>
            <div class="mindmap-inspector-stat"><strong>${secondary}</strong><span>${e(secondaryLabel)}</span></div>
          </div>
          <div class="mindmap-inspector-path"><span>Путь</span><strong>${e(path)}</strong></div>
          ${action}`;
        inspector.classList.remove("is-updating");
        void inspector.offsetWidth;
        inspector.classList.add("is-updating");
      }

      function prepareMindmapMotion(layer) {
        layer.querySelectorAll(".mindmap-edge").forEach((edge, index) => {
          if (!edge.classList.contains("mindmap-edge--context")) {
            edge.setAttribute("pathLength", "1");
          }
          edge.style.setProperty("--map-delay", `${Math.min(index * 9, 190)}ms`);
        });
        layer.querySelectorAll(".mindmap-node").forEach((node, index) => {
          node.style.setProperty("--map-delay", `${90 + Math.min(index * 20, 300)}ms`);
        });
      }

      function animateMindmapContext(...elements) {
        elements.forEach((element) => {
          element.classList.remove("is-updating");
          void element.offsetWidth;
          element.classList.add("is-updating");
        });
      }

      function renderMindmap({ fit = false } = {}) {
        const layer = document.getElementById("mindmap-layer");
        const summary = document.getElementById("mindmap-summary");
        const breadcrumbs = document.getElementById("mindmap-breadcrumbs");
        const backButton = document.querySelector('[data-map-action="back"]');
        if (!layer || !summary || !breadcrumbs) return;
        const { groups, group, categoryItem } = currentMindmapContext();
        const edges = [];
        const nodes = [];
        const points = [];
        let bounds;

        if (mapState.mode === "category" && group && categoryItem) {
          bounds = renderBubbleMindmapCategory(group, categoryItem, edges, nodes, points);
          mapState.expandedGroups = new Set([group.definition.id]);
          mapState.expandedCategories = new Set([categoryItem.category.id]);
          mapState.groups = [group];
          mapState.categories = [categoryItem];
        } else if (mapState.mode === "group" && group) {
          bounds = renderBubbleMindmapGroup(group, edges, nodes, points);
          mapState.expandedGroups = new Set([group.definition.id]);
          mapState.expandedCategories.clear();
          mapState.groups = [group];
          mapState.categories = group.categories;
        } else {
          mapState.mode = "root";
          mapState.activeGroupId = null;
          mapState.activeCategoryId = null;
          bounds = renderBubbleMindmapRoot(groups, edges, nodes, points);
          mapState.expandedGroups.clear();
          mapState.expandedCategories.clear();
          mapState.groups = groups;
          mapState.categories = [];
        }

        mapState.layoutMinX = 0;
        mapState.layoutWidth = bounds.width;
        mapState.layoutHeight = bounds.height;
        mapState.nodePoints = points;
        layer.innerHTML = `${edges.join("")}${nodes.join("")}`;
        fitMindmapNodeTitles(layer);
        requestAnimationFrame(() => {
          if (layer.isConnected) fitMindmapNodeTitles(layer);
        });
        document.fonts?.ready.then(() => {
          if (layer.isConnected) fitMindmapNodeTitles(layer);
        });
        prepareMindmapMotion(layer);
        breadcrumbs.innerHTML = mindmapBreadcrumbsHtml(group, categoryItem);
        summary.innerHTML =
          mapState.mode === "root"
            ? `<span><strong>${mindmapGroups.length}</strong> контуров</span><span><strong>${data.meta.canonicalTopicCount}</strong> тем</span><span><strong>${bubbleTimeLabel(data.topics.reduce((sum, topic) => sum + topic.readingMinutes, 0))}</strong> чтения</span>`
            : mapState.mode === "group"
              ? `<span><strong>${group.categories.length}</strong> ветвей</span><span><strong>${group.topicCount}</strong> тем</span><span><strong>${bubbleTimeLabel(group.readingMinutes)}</strong> чтения</span>`
              : `<span><strong>${categoryItem.topics.length}</strong> тем</span><span><strong>${categoryItem.topics.reduce((sum, topic) => sum + topic.readingMinutes, 0)}</strong> минут</span>`;
        animateMindmapContext(breadcrumbs, summary);
        if (backButton) backButton.disabled = mapState.mode === "root";
        renderMindmapInspector();
        applyMindmapTransform();
        if (fit) fitMindmap();
        animateMindmapBubbles();
      }

      function withMindmapTransition(update) {
        const viewport = document.getElementById("mindmap-viewport");
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion || !viewport) {
          update();
          return;
        }
        if (activeMindmapTransition) clearTimeout(activeMindmapTransition);
        viewport.classList.remove("is-navigating");
        void viewport.offsetWidth;
        viewport.classList.add("is-navigating");
        update();
        activeMindmapTransition = setTimeout(() => {
          activeMindmapTransition = null;
          viewport.classList.remove("is-navigating");
        }, 760);
      }

      function showMindmapRoot() {
        withMindmapTransition(() => {
          mapState.mode = "root";
          mapState.activeGroupId = null;
          mapState.activeCategoryId = null;
          mapState.selectedTopicSlug = null;
          mapState.inspector = { type: "root", id: "root" };
          renderMindmap({ fit: true });
        });
      }

      function showMindmapGroup(groupId) {
        const group = getMindmapGroups().find(
          (item) => item.definition.id === groupId,
        );
        if (!group) return;
        withMindmapTransition(() => {
          mapState.mode = "group";
          mapState.activeGroupId = groupId;
          mapState.activeCategoryId = null;
          mapState.selectedTopicSlug = null;
          mapState.inspector = { type: "group", id: groupId };
          renderMindmap({ fit: true });
        });
      }

      function focusMindmapViewport() {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const viewport = document.getElementById("mindmap-viewport");
          if (!viewport) return;
          fitMindmap();
          viewport.scrollIntoView({
            behavior: reducedMotionQuery.matches ? "auto" : "smooth",
            block: "center",
            inline: "nearest",
          });
        }));
      }

      function showMindmapCategory(categoryId, selectedTopicSlug = null) {
        const group = groupForCategory(categoryId);
        const item = group?.categories.find(
          (candidate) => candidate.category.id === categoryId,
        );
        if (!group || !item) return;
        withMindmapTransition(() => {
          mapState.mode = "category";
          mapState.activeGroupId = group.definition.id;
          mapState.activeCategoryId = categoryId;
          mapState.selectedTopicSlug = selectedTopicSlug;
          mapState.inspector = selectedTopicSlug
            ? { type: "topic", id: selectedTopicSlug }
            : { type: "category", id: categoryId };
          renderMindmap({ fit: true });
        });
      }

      function stepBackMindmap() {
        if (mapState.mode === "category" && mapState.activeGroupId) {
          showMindmapGroup(mapState.activeGroupId);
        } else if (mapState.mode === "group") {
          showMindmapRoot();
        }
      }

      function renderMindmapSearchResults() {
        const results = document.getElementById("mindmap-search-results");
        if (!results) return;
        const terms = normalize(mapState.query).split(" ").filter(Boolean);
        if (!terms.length) {
          results.classList.remove("is-open");
          results.innerHTML = "";
          return;
        }
        const matches = data.topics
          .filter((topic) =>
            terms.every((term) => topic.searchIndex.includes(term)),
          )
          .slice(0, 12);
        results.classList.add("is-open");
        results.innerHTML = matches.length
          ? matches.map((topic) => {
              const category = categoryById.get(topic.primaryCategoryId);
              const group = category ? groupForCategory(category.id) : null;
              return `
                <button class="mindmap-search-result" type="button" data-map-search-topic="${e(topic.slug)}">
                  <strong>${e(topic.title)}</strong>
                  <span>${e(group?.definition.title || "")} → ${e(category ? mindmapCategoryTitle(category) : "")}</span>
                </button>`;
            }).join("")
          : `<div class="mindmap-search-empty">Ничего не найдено. Попробуйте более короткий запрос.</div>`;
      }

      function initMindmap() {
        const viewport = document.getElementById("mindmap-viewport");
        const search = document.getElementById("mindmap-search");
        const panel = document.querySelector(".mindmap-panel");
        const minimap = document.querySelector(".mindmap-minimap");
        if (!viewport || !search || !panel) return;
        renderMindmap({ fit: true });
        let drag = null;

        viewport.addEventListener("pointerdown", (event) => {
          if (event.target.closest(".mindmap-node")) return;
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            mapX: mapState.x,
            mapY: mapState.y,
          };
          viewport.setPointerCapture(event.pointerId);
          viewport.classList.add("is-dragging");
        });
        viewport.addEventListener("pointermove", (event) => {
          if (!drag || event.pointerId !== drag.pointerId) return;
          mapState.x = drag.mapX + event.clientX - drag.startX;
          mapState.y = drag.mapY + event.clientY - drag.startY;
          applyMindmapTransform();
        });
        const endDrag = (event) => {
          if (!drag || event.pointerId !== drag.pointerId) return;
          drag = null;
          viewport.classList.remove("is-dragging");
        };
        viewport.addEventListener("pointerup", endDrag);
        viewport.addEventListener("pointercancel", endDrag);
        viewport.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            zoomMindmap(event.deltaY < 0 ? 1.12 : .89, event.clientX, event.clientY);
          },
          { passive: false },
        );

        const activateMapNode = (target) => {
          const topicNode = target.closest("[data-map-topic]");
          if (topicNode) {
            const slug = topicNode.dataset.mapTopic;
            if (mapState.selectedTopicSlug === slug) {
              location.hash = `topic=${slug}`;
              return;
            }
            mapState.selectedTopicSlug = slug;
            viewport.querySelectorAll("[data-map-topic]").forEach((node) =>
              node.classList.toggle("is-selected", node.dataset.mapTopic === slug),
            );
            renderMindmapInspector("topic", slug);
            return;
          }
          const categoryNode = target.closest("[data-map-category]");
          if (categoryNode) {
            showMindmapCategory(categoryNode.dataset.mapCategory);
            return;
          }
          const groupNode = target.closest("[data-map-group]");
          if (groupNode) {
            showMindmapGroup(groupNode.dataset.mapGroup);
            return;
          }
          if (target.closest("[data-map-root]")) showMindmapRoot();
        };

        viewport.addEventListener("click", (event) => activateMapNode(event.target));
        viewport.addEventListener("dblclick", (event) => {
          const topicNode = event.target.closest("[data-map-topic]");
          if (topicNode) location.hash = `topic=${topicNode.dataset.mapTopic}`;
        });
        viewport.addEventListener("mouseover", (event) => {
          const bubbleNode = event.target.closest(".mindmap-bubble");
          const topicNode = event.target.closest("[data-map-topic]");
          const categoryNode = event.target.closest("[data-map-category]");
          const groupNode = event.target.closest("[data-map-group]");
          if (bubbleNode) focusMindmapBubble(bubbleNode);
          if (topicNode) renderMindmapInspector("topic", topicNode.dataset.mapTopic);
          else if (categoryNode) renderMindmapInspector("category", categoryNode.dataset.mapCategory);
          else if (groupNode) renderMindmapInspector("group", groupNode.dataset.mapGroup);
          else if (event.target.closest("[data-map-root]")) renderMindmapInspector("root", "root");
        });
        viewport.addEventListener("mouseout", (event) => {
          const from = event.target.closest?.(".mindmap-bubble");
          const to = event.relatedTarget?.closest?.(".mindmap-bubble");
          if (from && from !== to) clearMindmapBubbleFocus();
        });
        viewport.addEventListener("mouseleave", clearMindmapBubbleFocus);
        viewport.addEventListener("focusin", (event) => {
          const bubbleNode = event.target.closest(".mindmap-bubble");
          const topicNode = event.target.closest("[data-map-topic]");
          const categoryNode = event.target.closest("[data-map-category]");
          const groupNode = event.target.closest("[data-map-group]");
          if (bubbleNode) focusMindmapBubble(bubbleNode);
          if (topicNode) renderMindmapInspector("topic", topicNode.dataset.mapTopic);
          else if (categoryNode) renderMindmapInspector("category", categoryNode.dataset.mapCategory);
          else if (groupNode) renderMindmapInspector("group", groupNode.dataset.mapGroup);
        });
        viewport.addEventListener("focusout", (event) => {
          if (!event.relatedTarget?.closest?.(".mindmap-bubble")) {
            clearMindmapBubbleFocus();
          }
        });
        viewport.addEventListener("keydown", (event) => {
          if (["Enter", " "].includes(event.key) && event.target.closest(".mindmap-node")) {
            event.preventDefault();
            activateMapNode(event.target);
            return;
          }
          if (event.key === "Escape") {
            event.preventDefault();
            stepBackMindmap();
            return;
          }
          if (["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(event.key)) {
            const nodes = [...viewport.querySelectorAll(".mindmap-node")];
            const index = nodes.indexOf(document.activeElement);
            if (index < 0) return;
            event.preventDefault();
            const direction = ["ArrowRight", "ArrowDown"].includes(event.key) ? 1 : -1;
            nodes[(index + direction + nodes.length) % nodes.length].focus();
          }
        });

        search.value = mapState.query;
        search.addEventListener("input", (event) => {
          mapState.query = event.target.value;
          renderMindmapSearchResults();
        });
        search.addEventListener("focus", renderMindmapSearchResults);
        search.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            mapState.query = "";
            search.value = "";
            renderMindmapSearchResults();
            search.blur();
          }
          if (event.key === "ArrowDown") {
            const firstResult = document.querySelector("[data-map-search-topic]");
            if (firstResult) {
              event.preventDefault();
              firstResult.focus();
            }
          }
        });

        panel.addEventListener("click", (event) => {
          const result = event.target.closest("[data-map-search-topic]");
          if (result) {
            const topic = topicBySlug.get(result.dataset.mapSearchTopic);
            if (!topic) return;
            document.getElementById("mindmap-search-results")?.classList.remove("is-open");
            showMindmapCategory(topic.primaryCategoryId, topic.slug);
            return;
          }
          const crumb = event.target.closest("[data-map-breadcrumb]");
          if (crumb) {
            if (crumb.dataset.mapBreadcrumb === "root") showMindmapRoot();
            if (crumb.dataset.mapBreadcrumb === "group") showMindmapGroup(crumb.dataset.groupId);
            if (crumb.dataset.mapBreadcrumb === "category") showMindmapCategory(crumb.dataset.categoryId);
            return;
          }
          const inspectorAction = event.target.closest("[data-inspector-action]");
          if (inspectorAction) {
            if (inspectorAction.dataset.inspectorAction === "group") {
              showMindmapGroup(inspectorAction.dataset.groupId);
            }
            if (inspectorAction.dataset.inspectorAction === "category") {
              showMindmapCategory(inspectorAction.dataset.categoryId);
            }
            if (inspectorAction.dataset.inspectorAction === "topic") {
              location.hash = `topic=${inspectorAction.dataset.topicSlug}`;
            }
          }
        });

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".mindmap-search-wrap")) {
            document.getElementById("mindmap-search-results")?.classList.remove("is-open");
          }
          if (!event.target.closest(".home-search-wrap")) {
            document.getElementById("home-search-results")?.classList.remove("is-open");
          }
        });

        document.querySelectorAll("[data-map-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.mapAction;
            if (action === "home" || action === "collapse") showMindmapRoot();
            if (action === "back") stepBackMindmap();
            if (action === "zoom-in") zoomMindmap(1.2);
            if (action === "zoom-out") zoomMindmap(.82);
            if (action === "fit") fitMindmap();
          });
        });
        minimap?.addEventListener("click", fitMindmap);
        window.addEventListener("resize", () => requestAnimationFrame(fitMindmap));
      }

      function homeSearchTopics(query, limit = 7) {
        const normalizedQuery = normalize(query);
        const ignored = new Set(["как", "что", "это", "или", "почему", "мне", "мой", "моя", "при", "для", "про", "без"]);
        const aliases = {
          откладываю: ["прокрастинация", "начало действия"],
          ревную: ["ревность", "доверие"],
          тревожусь: ["тревога", "страх"],
          похудеть: ["похудение", "энергетический баланс"],
          ссоримся: ["конфликт", "диалог"],
          стыжусь: ["стыд", "принятие"],
        };
        const baseTerms = normalizedQuery.split(" ").filter((term) => term.length > 2 && !ignored.has(term));
        const terms = [...new Set(baseTerms.flatMap((term) => [term, ...(aliases[term] || [])].map(normalize)))];
        if (!terms.length) return [];
        return data.topics
          .map((topic) => {
            const title = normalize(topic.title);
            const excerpt = normalize(topic.excerpt);
            let score = title.includes(normalizedQuery) ? 80 : 0;
            terms.forEach((term) => {
              if (title.includes(term)) score += 18;
              else if (excerpt.includes(term)) score += 7;
              else if (topic.searchIndex.includes(term)) score += 2;
            });
            return { topic, score };
          })
          .filter((item) => item.score > 0)
          .sort((left, right) => right.score - left.score || right.topic.relatedSlugs.length - left.topic.relatedSlugs.length)
          .slice(0, limit)
          .map((item) => item.topic);
      }

      function normalizeSpeechText(value) {
        return String(value ?? "")
          .replace(/\s+/g, " ")
          .replace(/\s+([,.;:!?])/g, "$1")
          .trim();
      }

      function articleGlossaryHtml(topic) {
        const entries = Array.isArray(topic.glossary) ? topic.glossary : [];
        if (!entries.length) return "";
        const termLabel = entries.length % 10 === 1 && entries.length % 100 !== 11
          ? "термин"
          : [2, 3, 4].includes(entries.length % 10) && ![12, 13, 14].includes(entries.length % 100)
            ? "термина"
            : "терминов";
        return `
          <details class="article-glossary" id="article-glossary">
            <summary class="article-glossary-summary">
