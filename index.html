                <span class="glossary-preview" aria-hidden="true">${entries.slice(0, 4).map((entry) => `<span>${e(entry.term)}</span>`).join("")}</span>
              </span>
              <span class="glossary-chevron" aria-hidden="true">⌄</span>
            </summary>
            <dl class="glossary-grid">
              ${entries.map((entry) => `<div class="glossary-entry"><dt>${e(entry.term)}</dt><dd>${e(entry.definition)}</dd></div>`).join("")}
            </dl>
          </details>`;
      }

      function speechTextForTable(table) {
        const rows = [...table.rows];
        if (!rows.length) return "";
        const firstCells = [...rows[0].cells];
        const hasHeader = firstCells.some((cell) => cell.tagName === "TH");
        const headers = hasHeader
          ? firstCells.map((cell, index) => normalizeSpeechText(cell.textContent) || `Колонка ${index + 1}`)
          : firstCells.map((_cell, index) => `Колонка ${index + 1}`);
        const bodyRows = hasHeader ? rows.slice(1) : rows;
        const spokenRows = bodyRows.map((row, rowIndex) => {
          const values = [...row.cells].map((cell) => normalizeSpeechText(cell.textContent));
          const pairs = values
            .map((value, cellIndex) => value ? `${headers[cellIndex] || `Колонка ${cellIndex + 1}`}: ${value}` : "")
            .filter(Boolean);
          return pairs.length ? `Строка ${rowIndex + 1}. ${pairs.join(". ")}.` : "";
        }).filter(Boolean);
        const heading = hasHeader ? `Колонки: ${headers.join(", ")}.` : "";
        return normalizeSpeechText(`Таблица. ${heading} ${spokenRows.join(" ")}`);
      }

      function speechTextForElement(element) {
        if (element.tagName === "TABLE") return speechTextForTable(element);
        let text = "";
        if (element.tagName === "LI") {
          const clone = element.cloneNode(true);
          clone.querySelectorAll("ul, ol").forEach((list) => list.remove());
          text = normalizeSpeechText(clone.textContent);
        } else {
          text = normalizeSpeechText(element.textContent);
        }
        if (!text) return "";
        if (element.tagName === "H2") return `Раздел. ${text}.`;
        if (element.tagName === "H3") return `Подраздел. ${text}.`;
        if (/^H[4-6]$/.test(element.tagName)) return `${text}.`;
        if (element.tagName === "LI") return `Пункт. ${text}`;
        if (element.tagName === "DT") return `Термин. ${text}.`;
        if (element.tagName === "DD") return `Определение. ${text}`;
        return text;
      }

      function splitSpeechText(value, limit = 260) {
        const text = normalizeSpeechText(value);
        if (!text) return [];
        const sentences = text.match(/[^.!?;…]+[.!?;…]+|[^.!?;…]+$/g) || [text];
        const pieces = [];
        sentences.forEach((sentence) => {
          const clean = sentence.trim();
          if (clean.length <= limit) {
            pieces.push(clean);
            return;
          }
          const words = clean.split(" ");
          let buffer = "";
          words.forEach((word) => {
            if (!buffer || `${buffer} ${word}`.length <= limit) {
              buffer = buffer ? `${buffer} ${word}` : word;
            } else {
              pieces.push(buffer);
              buffer = word;
            }
          });
          if (buffer) pieces.push(buffer);
        });
        return pieces;
      }

      function collectSpeechContent(article) {
        const sections = [];
        const segments = [];
        let activeSection = "intro";
        let sectionNumber = 0;
        let introHasContent = false;
        const candidates = [...article.querySelectorAll("h2, h3, h4, h5, h6, p, li, table, dt, dd")];

        candidates.forEach((element) => {
          if (element.closest(".speech-reader")) return;
          if (element.closest('[data-speech-exclude="true"]')) return;
          if (element.tagName !== "TABLE" && element.closest("table")) return;
          if (element.tagName === "P" && element.closest("li")) return;
          if (element.tagName === "LI" && element.parentElement?.closest("li")) return;

          if (element.tagName === "H2") {
            sectionNumber += 1;
            activeSection = `section-${sectionNumber}`;
            sections.push({
              value: activeSection,
              title: normalizeSpeechText(element.textContent) || `Раздел ${sectionNumber}`,
            });
          }

          const text = speechTextForElement(element);
          if (!text) return;
          if (activeSection === "intro") introHasContent = true;
          const highlightNode =
            element.tagName === "TABLE" ? element.closest(".table-scroll") || element : element;
          segments.push({
            text,
            node: highlightNode,
            section: activeSection,
            label: normalizeSpeechText(element.textContent).slice(0, 120),
          });
        });

        if (introHasContent) {
          sections.unshift({
            value: "intro",
            title: sections.length ? "Введение" : "Основной текст",
          });
        }
        return { sections, segments };
      }

      function initSpeechReader(topic, article) {
        const panel = document.getElementById("speech-reader");
        if (!panel) return () => {};

        const synth = window.speechSynthesis;
        const supported =
          "speechSynthesis" in window &&
          "SpeechSynthesisUtterance" in window;
        const playButton = panel.querySelector('[data-speech-action="play"]');
        const pauseButton = panel.querySelector('[data-speech-action="pause"]');
        const stopButton = panel.querySelector('[data-speech-action="stop"]');
        const previousButton = panel.querySelector('[data-speech-action="previous"]');
        const nextButton = panel.querySelector('[data-speech-action="next"]');
        const sectionSelect = document.getElementById("speech-section");
        const voiceSelect = document.getElementById("speech-voice");
        const rateInput = document.getElementById("speech-rate");
        const rateValue = document.getElementById("speech-rate-value");
        const autoscrollInput = document.getElementById("speech-autoscroll");
        const status = document.getElementById("speech-reader-status");
        const now = document.getElementById("speech-reader-now");
        const progress = panel.querySelector(".speech-progress");
        const progressBar = document.getElementById("speech-progress-bar");
        const content = collectSpeechContent(article);
        const sectionValues = content.sections.map((section) => section.value);
        const progressKey = `knowledge-speech-progress:${topic.slug}`;
        const settingsKey = "knowledge-speech-settings";
        let settings = { voice: "", rate: 1, autoscroll: true };
        let storedProgress = null;
        let voices = [];
        let queue = [];
        let queueIndex = 0;
        let queueScope = "all";
        let generation = 0;
        let activeNode = null;
        let running = false;
        let paused = false;

        try {
          settings = { ...settings, ...JSON.parse(localStorage.getItem(settingsKey) || "{}") };
          storedProgress = JSON.parse(localStorage.getItem(progressKey) || "null");
        } catch (_) {}

        const persistSettings = () => {
          settings.voice = voiceSelect.value;
          settings.rate = Number(rateInput.value);
          settings.autoscroll = autoscrollInput.checked;
          try { localStorage.setItem(settingsKey, JSON.stringify(settings)); } catch (_) {}
        };

        const setProgress = (value) => {
          const normalized = Math.min(1, Math.max(0, value));
          progressBar.style.transform = `scaleX(${normalized})`;
          progress.setAttribute("aria-valuenow", String(Math.round(normalized * 100)));
        };

        const clearHighlight = () => {
          activeNode?.classList.remove("speech-reading-target");
          activeNode = null;
        };

        const setHighlight = (node) => {
          if (activeNode === node) return;
          clearHighlight();
          activeNode = node;
          activeNode?.classList.add("speech-reading-target");
          if (!activeNode || !autoscrollInput.checked) return;
          const rect = activeNode.getBoundingClientRect();
          if (rect.top < 100 || rect.bottom > innerHeight - 70) {
            activeNode.scrollIntoView({
              behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
              block: "center",
            });
          }
        };

        const updateTransport = () => {
          playButton.disabled = running && !paused;
          playButton.querySelector("[data-speech-play-label]").textContent =
            storedProgress && !running ? "Продолжить" : "Слушать";
          pauseButton.disabled = !running;
          pauseButton.setAttribute("aria-label", paused ? "Продолжить" : "Пауза");
          pauseButton.classList.toggle("is-active", paused);
          stopButton.disabled = !running && !storedProgress;
        };

        const saveProgress = () => {
          if (!queue.length || queueIndex >= queue.length) return;
          const value = {
            scope: queueScope,
            index: queueIndex,
            section: queue[queueIndex]?.section || "",
          };
          storedProgress = value;
          try { localStorage.setItem(progressKey, JSON.stringify(value)); } catch (_) {}
          updateTransport();
        };

        const clearStoredProgress = () => {
          storedProgress = null;
          try { localStorage.removeItem(progressKey); } catch (_) {}
          updateTransport();
        };

        const buildQueue = (scope) => {
          const selected = scope === "all"
            ? content.segments
            : content.segments.filter((segment) => segment.section === scope);
          const items = [];
          if (scope === "all") {
            splitSpeechText(`Статья. ${topic.title}. ${topic.excerpt}`).forEach((text) => {
              items.push({ text, node: null, section: "intro", label: topic.title });
            });
          }
          selected.forEach((segment) => {
            splitSpeechText(segment.text).forEach((text) => {
              items.push({ ...segment, text });
            });
          });
          return items;
        };

        const selectedVoice = () =>
          voices.find((voice) => (voice.voiceURI || voice.name) === voiceSelect.value) ||
          voices.find((voice) => /^ru\b/i.test(voice.lang) && voice.localService) ||
          voices.find((voice) => /^ru\b/i.test(voice.lang)) ||
          voices[0];

        const finishReading = () => {
          running = false;
          paused = false;
          queueIndex = queue.length;
          clearHighlight();
          clearStoredProgress();
          setProgress(1);
          status.textContent = "Статья прочитана";
          now.textContent = "Озвучивание завершено";
          updateTransport();
        };

        const speakNext = (activeGeneration) => {
          if (activeGeneration !== generation || !running) return;
          if (queueIndex >= queue.length) {
            finishReading();
            return;
          }
          const item = queue[queueIndex];
          const utterance = new SpeechSynthesisUtterance(item.text);
          const voice = selectedVoice();
          if (voice) {
            utterance.voice = voice;
            utterance.lang = voice.lang || "ru-RU";
          } else {
            utterance.lang = "ru-RU";
          }
          utterance.rate = Number(rateInput.value);
          utterance.pitch = 1;
          setHighlight(item.node);
          setProgress(queueIndex / Math.max(1, queue.length));
          status.textContent = `Читаю · ${queueIndex + 1} из ${queue.length}`;
          now.textContent = item.label || item.text;
          saveProgress();
          utterance.onend = () => {
            if (activeGeneration !== generation || !running) return;
            queueIndex += 1;
            speakNext(activeGeneration);
          };
          utterance.onerror = (event) => {
            if (activeGeneration !== generation || event.error === "canceled" || event.error === "interrupted") return;
            queueIndex += 1;
            status.textContent = "Пропускаю фрагмент, который не удалось озвучить";
            speakNext(activeGeneration);
          };
          synth.speak(utterance);
        };

        const cancelCurrent = ({ reset = false } = {}) => {
          if (!reset) saveProgress();
          generation += 1;
          synth.cancel();
          running = false;
          paused = false;
          clearHighlight();
          if (reset) {
            queue = [];
            queueIndex = 0;
            clearStoredProgress();
            setProgress(0);
            status.textContent = "Озвучивание остановлено";
            now.textContent = "Можно выбрать другой раздел";
          }
          updateTransport();
        };

        const startReading = (scope = sectionSelect.value, forceStart = false) => {
          if (!supported) return;
          if (paused && running && queueScope === scope && !forceStart) {
            synth.resume();
            paused = false;
            status.textContent = `Читаю · ${queueIndex + 1} из ${queue.length}`;
            updateTransport();
            return;
          }
          if (running) cancelCurrent();
          queueScope = scope;
          queue = buildQueue(scope);
          const canResume =
            !forceStart &&
            storedProgress &&
            storedProgress.scope === scope &&
            Number.isInteger(storedProgress.index);
          queueIndex = canResume
            ? Math.min(Math.max(0, storedProgress.index), Math.max(0, queue.length - 1))
            : 0;
          running = true;
          paused = false;
          generation += 1;
          const activeGeneration = generation;
          setTimeout(() => speakNext(activeGeneration), 35);
          updateTransport();
        };

        const refreshVoices = () => {
          if (!supported) return;
          voices = synth.getVoices().slice().sort((left, right) => {
            const leftScore = (/^ru\b/i.test(left.lang) ? 0 : 2) + (left.localService ? 0 : 1);
            const rightScore = (/^ru\b/i.test(right.lang) ? 0 : 2) + (right.localService ? 0 : 1);
            return leftScore - rightScore || left.name.localeCompare(right.name, "ru");
          });
          const previous = voiceSelect.value || settings.voice;
          voiceSelect.innerHTML = voices.length
            ? voices.map((voice) => {
                const value = voice.voiceURI || voice.name;
                const locality = voice.localService ? "локальный" : "сетевой";
                return `<option value="${e(value)}">${e(voice.name)} · ${e(voice.lang || "—")} · ${locality}</option>`;
              }).join("")
            : '<option value="">Системный голос · русский язык</option>';
          const fallback =
            voices.find((voice) => /^ru\b/i.test(voice.lang) && voice.localService) ||
            voices.find((voice) => /^ru\b/i.test(voice.lang)) ||
            voices.find((voice) => voice.localService) ||
            voices[0];
          const preferred = voices.find((voice) => (voice.voiceURI || voice.name) === previous) || fallback;
          if (preferred) voiceSelect.value = preferred.voiceURI || preferred.name;
          persistSettings();
        };

        sectionSelect.innerHTML = [
          '<option value="all">Вся статья</option>',
          ...content.sections.map((section, index) =>
            `<option value="${e(section.value)}">${String(index + 1).padStart(2, "0")} · ${e(section.title)}</option>`
          ),
        ].join("");
        if (storedProgress?.scope && [...sectionSelect.options].some((option) => option.value === storedProgress.scope)) {
          sectionSelect.value = storedProgress.scope;
          status.textContent = "Найдена сохранённая позиция";
          now.textContent = "Нажмите «Продолжить», чтобы вернуться к прослушиванию";
        } else {
          storedProgress = null;
          status.textContent = `${content.sections.length} разделов готовы к озвучке`;
        }

        rateInput.value = String(Math.min(1.5, Math.max(.7, Number(settings.rate) || 1)));
        rateValue.value = `${Number(rateInput.value).toFixed(1).replace(".", ",")}×`;
        rateValue.textContent = rateValue.value;
        autoscrollInput.checked = settings.autoscroll !== false;

        if (!supported) {
          status.textContent = "В этом браузере нет встроенной озвучки";
          now.textContent = "Откройте файл в современном Chrome, Edge или Safari";
          panel.querySelectorAll("button, select, input").forEach((control) => control.disabled = true);
          return () => {};
        }

        refreshVoices();
        synth.addEventListener?.("voiceschanged", refreshVoices);
        updateTransport();

        playButton.addEventListener("click", () => startReading());
        pauseButton.addEventListener("click", () => {
          if (!running) return;
          if (paused) {
            synth.resume();
            paused = false;
            status.textContent = `Читаю · ${queueIndex + 1} из ${queue.length}`;
          } else {
            synth.pause();
            paused = true;
            saveProgress();
            status.textContent = "Пауза";
          }
          updateTransport();
        });
        stopButton.addEventListener("click", () => cancelCurrent({ reset: true }));
        sectionSelect.addEventListener("change", () => {
          cancelCurrent({ reset: true });
          status.textContent = "Фрагмент выбран";
          now.textContent = sectionSelect.options[sectionSelect.selectedIndex]?.textContent || "";
        });
        voiceSelect.addEventListener("change", persistSettings);
        rateInput.addEventListener("input", () => {
          rateValue.value = `${Number(rateInput.value).toFixed(1).replace(".", ",")}×`;
          rateValue.textContent = rateValue.value;
          persistSettings();
        });
        autoscrollInput.addEventListener("change", persistSettings);

        const stepSection = (direction) => {
          let currentSection = sectionSelect.value;
          if (currentSection === "all" && queue[queueIndex]?.section) {
            currentSection = queue[queueIndex].section;
          }
          let index = sectionValues.indexOf(currentSection);
          if (index < 0) index = direction > 0 ? -1 : sectionValues.length;
          const nextIndex = Math.min(sectionValues.length - 1, Math.max(0, index + direction));
          if (nextIndex === index || nextIndex < 0) return;
          sectionSelect.value = sectionValues[nextIndex];
          cancelCurrent({ reset: true });
          startReading(sectionValues[nextIndex], true);
        };
        previousButton.addEventListener("click", () => stepSection(-1));
        nextButton.addEventListener("click", () => stepSection(1));

        return () => {
          if (running) saveProgress();
          generation += 1;
          synth.cancel();
          clearHighlight();
          synth.removeEventListener?.("voiceschanged", refreshVoices);
        };
      }

      function renderTopic(slug) {
        topicCleanup.splice(0).forEach((cleanup) => cleanup());
        setRevisionVisibility(false);
        const topic = topicBySlug.get(slug);
        if (!topic) {
          location.hash = "atlas";
          return;
        }
        const category = categoryById.get(topic.primaryCategoryId);
        const books = topic.bookIds.map((id) => bookById.get(id)).filter(Boolean);
        if (!topic.bodyHtml && publicContent) {
          const saved = state.saved.has(topic.slug);
          document.title = topic.title + " — База знаний";
          app.innerHTML = `
            <main class="topic-view shell ${accentClass(category?.color)}">
              <a class="back-link" href="#atlas">← Вернуться ко всем темам</a>
              <section class="hud topic-hero">
                <div>
                  <span class="eyebrow">${e(category?.code || "NODE")} · ${e(category?.title || "Тема")}</span>
                  <h1>${e(topic.title)}</h1>
                  <p class="topic-excerpt">${e(topic.excerpt)}</p>
                  <div class="topic-badges"><span>${topic.readingMinutes} мин основного текста</span><span>${topic.sectionCount} разделов текста</span></div>
                </div>
                <aside class="topic-profile">
                  <div class="topic-profile-grid">
                    <div><strong>${topic.readingMinutes}</strong><span>минут текста</span></div>
                    <div><strong>${Number(topic.wordCount).toLocaleString("ru")}</strong><span>слов</span></div>
                  </div>
                  <button class="save-button${saved ? " is-saved" : ""}" type="button" data-save="${e(topic.slug)}" aria-pressed="${saved}" aria-live="polite">${saved ? "− Удалить из сохранённых" : "＋ Сохранить тему"}</button>
                </aside>
              </section>
              <section class="hud topic-content-loading" aria-live="polite">
                <span class="topic-content-loading-mark" aria-hidden="true"></span>
                <div><strong>Загружаю статью</strong><p>Главная уже доступна, а полный текст, глоссарий и источники подгружаются отдельным компактным блоком.</p></div>
                <span data-content-load-state>Статья получает приоритет</span>
              </section>
            </main>`;
          animateRouteEntry();
          ensureTopicContent(topic)
            .then(() => {
              if (location.hash === `#topic=${topic.slug}`) renderTopic(topic.slug);
            })
            .catch((error) => {
              const loading = document.querySelector(".topic-content-loading");
              if (!loading) return;
              loading.classList.add("has-error");
              loading.innerHTML = `<div><strong>Статью не удалось загрузить</strong><p>${e(error.message)} Проверьте соединение и повторите попытку.</p><button class="home-action" type="button" data-retry-topic="${e(topic.slug)}">Повторить</button></div>`;
            });
          return;
        }
        const related = topic.relatedSlugs.map((id) => topicBySlug.get(id)).filter(Boolean).slice(0, 4);
        const saved = state.saved.has(topic.slug);
        const previousReading = readingRecord(topic.slug);
        const restorePosition = resumeRequestedSlug === topic.slug
          ? Math.max(0, Number(previousReading?.scrollY) || 0)
          : 0;
        resumeRequestedSlug = null;
        touchReadingHistory(topic, {
          progress: Number(previousReading?.progress) || 0,
          scrollY: Number(previousReading?.scrollY) || 0,
        });
        document.title = topic.title + " — База знаний";

        app.innerHTML = `
          <div class="reading-progress ${accentClass(category?.color)}" id="reading-progress" aria-hidden="true">
            <span class="reading-progress-fill" id="reading-progress-bar"></span>
            <span class="reading-progress-markers" id="reading-progress-markers"></span>
          </div>
          <main class="topic-view shell ${accentClass(category?.color)}">
            <a class="back-link" href="#atlas">← Вернуться ко всем темам</a>
            <section class="hud topic-hero">
              <div>
                <span class="eyebrow">${e(category?.code || "NODE")} · ${e(category?.title || "Тема")}</span>
                <h1>${e(topic.title)}</h1>
                <p class="topic-excerpt">${e(topic.excerpt)}</p>
                <div class="topic-badges">
                  ${topic.warning ? "<span>⚠ осторожно</span>" : ""}
                  <span title="Без раздела источников">${topic.readingMinutes} мин основного текста</span>
                  <span title="Без раздела источников">${topic.sectionCount} разделов текста</span>
                </div>
              </div>
              <aside class="topic-profile">
                <div class="topic-profile-grid">
                  <div><strong>${topic.readingMinutes}</strong><span>минут основного текста</span></div>
                  <div><strong>${Number(topic.wordCount).toLocaleString("ru")}</strong><span>слов без источников</span></div>
                  <div><strong>${topic.sectionCount}</strong><span>разделов текста</span></div>
                  <div><strong>${topic.relatedSlugs.length}</strong><span>смысловых связей</span></div>
                </div>
                <button class="save-button${saved ? " is-saved" : ""}" type="button" data-save="${e(topic.slug)}" aria-pressed="${saved}" aria-live="polite">${saved ? "− Удалить из сохранённых" : "＋ Сохранить тему"}</button>
              </aside>
            </section>

            <div class="article-layout">
              <article class="hud knowledge-article" id="article">${articleGlossaryHtml(topic)}${speechReaderHtml()}<div class="article-reading-content" id="article-reading-content" data-reading-minutes="${topic.readingMinutes}" data-reading-words="${topic.wordCount}" data-reading-sections="${topic.sectionCount}">${topic.bodyHtml}</div>${articleSourcesHtml(topic)}</article>
              <aside class="topic-aside">
                <div class="hud aside-panel">
                  <h2 class="aside-title">Содержание</h2>
                  <nav class="toc" id="toc"></nav>
                </div>
              </aside>
            </div>

            ${related.length ? `
              <section class="related">
                <h2>Связанные темы</h2>
                <div class="related-grid">
                  ${related.map((item) => {
                    const itemCategory = categoryById.get(item.primaryCategoryId);
                    return `<a class="related-card ${accentClass(itemCategory?.color)}" href="#topic=${e(item.slug)}" data-topic="${e(item.slug)}">
                      <span>${e(itemCategory?.title || "Тема")}</span><strong>${e(item.title)}</strong><p>${e(item.excerpt)}</p>
                    </a>`;
                  }).join("")}
                </div>
              </section>` : ""}
          </main>`;

        const headings = [...document.querySelectorAll("#article h2, #article h3")];
        document.getElementById("toc").innerHTML = headings.map((heading) =>
          `<a href="#${e(heading.id)}" data-anchor="${e(heading.id)}" data-level="${heading.tagName === "H3" ? "3" : "2"}">${e(heading.textContent)}</a>`
        ).join("");

        const tocLinks = [...document.querySelectorAll("#toc a")];
        const headingObserver = new IntersectionObserver((entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
          if (!visible[0]) return;
          tocLinks.forEach((link) =>
            link.classList.toggle("is-active", link.dataset.anchor === visible[0].target.id)
          );
        }, { rootMargin: "-86px 0px -68% 0px", threshold: [0, 1] });
        headings.forEach((heading) => headingObserver.observe(heading));

        const article = document.getElementById("article");
        const readingContent = document.getElementById("article-reading-content");
        if (AUDIO_READER_ENABLED) {
          topicCleanup.push(initSpeechReader(topic, article));
        }
        const progressRail = document.getElementById("reading-progress");
        const progressBar = document.getElementById("reading-progress-bar");
        const progressMarkersHost = document.getElementById("reading-progress-markers");
        const readingSections = [...readingContent.querySelectorAll("h2")];
        progressMarkersHost.innerHTML = readingSections.map((_, index) =>
          `<i class="reading-progress-marker" data-reading-marker="${index}"></i>`
        ).join("");
        const progressMarkers = [...progressMarkersHost.querySelectorAll("[data-reading-marker]")];
        let historyWriteTimer = null;
        let progressAnimationTimer = null;
        let sectionThresholds = [];
        let completedSectionCount = null;
        const readingRange = () => {
          const rect = readingContent.getBoundingClientRect();
          const start = rect.top + scrollY - 90;
          const end = rect.bottom + scrollY - innerHeight + 90;
          return { start, distance: Math.max(1, end - start) };
        };
        const refreshSectionMarkers = () => {
          const { start, distance } = readingRange();
          sectionThresholds = readingSections.map((_, index) => {
            if (index === readingSections.length - 1) return 1;
            const nextRect = readingSections[index + 1].getBoundingClientRect();
            const nextStart = nextRect.top + scrollY - innerHeight + 90;
            return Math.min(1, Math.max(0, (nextStart - start) / distance));
          });
          progressMarkers.forEach((marker, index) => {
            marker.style.left = `${sectionThresholds[index] * 100}%`;
          });
        };
        const animateSectionCompletion = (index) => {
          if (reducedMotionQuery.matches || index < 0 || !progressMarkers[index]) return;
          clearTimeout(progressAnimationTimer);
          progressRail.classList.remove("is-section-complete", "is-article-complete");
          progressMarkers.forEach((marker) => marker.classList.remove("is-celebrating"));
          void progressRail.offsetWidth;
          progressRail.style.setProperty("--section-x", `${sectionThresholds[index] * 100}%`);
          progressRail.classList.add("is-section-complete");
          if (index === readingSections.length - 1) progressRail.classList.add("is-article-complete");
          progressMarkers[index].classList.add("is-celebrating");
          progressAnimationTimer = setTimeout(() => {
            progressRail.classList.remove("is-section-complete", "is-article-complete");
            progressMarkers[index]?.classList.remove("is-celebrating");
          }, 800);
        };
        const persistPosition = (progress) => {
          clearTimeout(historyWriteTimer);
          historyWriteTimer = setTimeout(() => {
            touchReadingHistory(topic, {
              progress: Math.round(progress * 1000) / 1000,
              scrollY: Math.round(scrollY),
            });
          }, 220);
        };
        const updateReadingProgress = () => {
          const { start, distance } = readingRange();
          const progress = Math.min(1, Math.max(0, (scrollY - start) / distance));
          progressBar.style.transform = `scaleX(${progress})`;
          const nextCompletedCount = sectionThresholds.filter((threshold) => progress + .002 >= threshold).length;
          progressMarkers.forEach((marker, index) => marker.classList.toggle("is-complete", index < nextCompletedCount));
          if (completedSectionCount !== null && nextCompletedCount > completedSectionCount) {
            animateSectionCompletion(nextCompletedCount - 1);
          }
          completedSectionCount = nextCompletedCount;
          persistPosition(progress);
        };
        const handleReadingResize = () => {
          refreshSectionMarkers();
          updateReadingProgress();
        };
        refreshSectionMarkers();
        addEventListener("scroll", updateReadingProgress, { passive: true });
        addEventListener("resize", handleReadingResize);
        topicCleanup.push(
          () => headingObserver.disconnect(),
          () => removeEventListener("scroll", updateReadingProgress),
          () => removeEventListener("resize", handleReadingResize),
          () => {
            clearTimeout(historyWriteTimer);
            clearTimeout(progressAnimationTimer);
            const { start, distance } = readingRange();
            const progress = Math.min(1, Math.max(0, (scrollY - start) / distance));
            touchReadingHistory(topic, { progress: Math.round(progress * 1000) / 1000, scrollY: Math.round(scrollY) });
          },
        );

        const previousScrollBehavior = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = "auto";
        window.scrollTo(0, Math.min(restorePosition, Math.max(0, document.documentElement.scrollHeight - innerHeight)));
        updateReadingProgress();
        requestAnimationFrame(() => {
          document.documentElement.style.scrollBehavior = previousScrollBehavior;
          animateRouteEntry();
          initRevealMotion(app);
        });
      }

      function route() {
        const hash = location.hash.slice(1);
        if (hash.startsWith("topic=")) {
          renderTopic(decodeURIComponent(hash.slice("topic=".length)));
          return;
        }
        renderHome();
        if (
          [
            "home",
            "library",
            "areas",
            "routes",
            "updated",
            "mindmap",
            "atlas",
            "methodology",
            "books",
            "schema-matrix",
          ].includes(hash)
        ) {
          requestAnimationFrame(() => document.getElementById(hash)?.scrollIntoView());
        }
      }

      document.addEventListener("click", (event) => {
        const resumeLink = event.target.closest("[data-resume]");
        if (resumeLink) resumeRequestedSlug = resumeLink.dataset.resume;

        const retryTopicButton = event.target.closest("[data-retry-topic]");
        if (retryTopicButton) {
          renderTopic(retryTopicButton.dataset.retryTopic);
          return;
        }

        if (event.target.closest("[data-profile-export]")) {
          exportPortableProfile();
          return;
        }

        if (event.target.closest("[data-profile-import]")) {
          document.querySelector("[data-profile-file]")?.click();
          return;
        }

        if (event.target.closest("[data-cloud-sync]")) {
          syncCloudProfile().catch((error) => cloudStatus(error.message, "error"));
          return;
        }

        if (event.target.closest("[data-cloud-logout]")) {
          logoutCloudProfile().catch((error) => cloudStatus(error.message, "error"));
          return;
        }

        const removeSavedButton = event.target.closest("[data-remove-saved]");
        if (removeSavedButton) {
          event.preventDefault();
          const slug = removeSavedButton.dataset.removeSaved;
          state.saved.delete(slug);
          try { localStorage.setItem("petryakov-saved", JSON.stringify([...state.saved])); } catch (_) {}
          const savedItem = removeSavedButton.closest("[data-saved-item]");
          if (savedItem && !reducedMotionQuery.matches) {
            savedItem.classList.add("is-removing");
            setTimeout(refreshHomeLibraryCard, 150);
          } else {
            refreshHomeLibraryCard();
          }
          return;
        }

        const areaButton = event.target.closest("[data-area-group]");
        if (areaButton) {
          showMindmapGroup(areaButton.dataset.areaGroup);
          focusMindmapViewport();
          return;
        }

        if (event.target.closest("[data-random-topic]")) {
          const topic = data.topics[Math.floor(Math.random() * data.topics.length)];
          if (topic) location.hash = `topic=${topic.slug}`;
          return;
        }

        const bookButton = event.target.closest("[data-book]");
        if (bookButton) {
          state.book = state.book === bookButton.dataset.book ? "all" : bookButton.dataset.book;
          state.category = "all";
          state.query = "";
          state.visible = Number.MAX_SAFE_INTEGER;
          renderHome();
          setTimeout(() => document.getElementById("atlas")?.scrollIntoView(), 30);
          return;
        }

        if (event.target.closest("[data-all-books]")) {
          state.book = "all";
          state.category = "all";
          state.query = "";
          state.visible = Number.MAX_SAFE_INTEGER;
          renderHome();
          setTimeout(() => document.getElementById("atlas")?.scrollIntoView(), 30);
          return;
        }

        const categoryButton = event.target.closest("[data-category]");
        if (categoryButton) {
          state.category = categoryButton.dataset.category;
          state.visible = Number.MAX_SAFE_INTEGER;
          renderAtlas();
          return;
        }

        const domainButton = event.target.closest("[data-domain]");
        if (domainButton) {
          state.category = domainButton.dataset.domain;
          state.book = "schema";
          state.query = "";
          state.visible = Number.MAX_SAFE_INTEGER;
          renderAtlas();
          setTimeout(() => document.getElementById("atlas")?.scrollIntoView(), 30);
          return;
        }

        if (event.target.closest("[data-reset]")) {
          state.query = "";
          state.category = "all";
          state.book = "all";
          state.visible = 24;
          renderHome();
          setTimeout(() => document.getElementById("atlas")?.scrollIntoView(), 30);
          return;
        }

        if (event.target.closest("[data-more]")) {
          state.visible += 24;
          renderAtlas();
          return;
        }

        if (event.target.closest("[data-show-all]")) {
          state.visible = Number.MAX_SAFE_INTEGER;
          renderAtlas();
          return;
        }

        const saveButton = event.target.closest("[data-save]");
        if (saveButton) {
          const slug = saveButton.dataset.save;
          state.saved.has(slug) ? state.saved.delete(slug) : state.saved.add(slug);
          try { localStorage.setItem("petryakov-saved", JSON.stringify([...state.saved])); } catch (_) {}
          const saved = state.saved.has(slug);
          saveButton.classList.toggle("is-saved", saved);
          saveButton.setAttribute("aria-pressed", String(saved));
          saveButton.textContent = saved ? "− Удалить из сохранённых" : "＋ Сохранить тему";
          refreshHomeLibraryCard();
          return;
        }

        const anchor = event.target.closest("[data-anchor]");
        if (anchor) {
          event.preventDefault();
          document.getElementById(anchor.dataset.anchor)?.scrollIntoView();
        }
      });

      document.addEventListener("change", (event) => {
        const input = event.target.closest("[data-profile-file]");
        if (!input) return;
        importPortableProfile(input.files?.[0]).catch((error) => profileStatus(error.message, "error"));
        input.value = "";
      });

      document.addEventListener("submit", (event) => {
        const form = event.target.closest("[data-cloud-auth]");
        if (!form) return;
        event.preventDefault();
        const mode = event.submitter?.dataset.cloudMode || "signin";
        authenticateCloudProfile(form, mode).catch((error) => cloudStatus(error.message, "error"));
      });

      window.addEventListener("hashchange", route);
      if (publicContent && "serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
      route();
    })();
  </script>
</body>
</html>
